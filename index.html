<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav Classes | Premium LMS</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: #1e293b; }
        h1, h2, h3, .font-heading { font-family: 'Outfit', sans-serif; }

        /* --- Improved Toggle Styling --- */
        .toggle-container {
            display: inline-flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
        }

        .toggle-item {
            padding: 8px 20px;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            color: #64748b;
        }

        .toggle-item.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 4px 12px -2px rgba(79, 70, 229, 0.12);
        }

        .class-pill-grid {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
        }
        .class-pill-grid::-webkit-scrollbar { display: none; }

        .class-pill {
            white-space: nowrap;
            padding: 6px 16px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.025em;
            border: 2px solid #f1f5f9;
            background: white;
            color: #94a3b8;
            transition: all 0.2s;
        }

        .class-pill.active {
            border-color: var(--primary);
            color: var(--primary);
            background: #eff6ff;
        }

        .card-shadow {
            background: white;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }
        .card-shadow:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .btn-primary { background: var(--primary); color: white; transition: 0.2s; }
        .btn-primary:hover { transform: scale(1.02); filter: brightness(1.1); }
    </style>
</head>
<body>

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="router.navigate('home')">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-200">
                    <i data-lucide="graduation-cap" class="text-white w-6 h-6"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">Gaurav<span class="text-indigo-600">Classes</span></span>
            </div>

            <div class="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-600">
                <button onclick="router.navigate('courses')" class="hover:text-indigo-600 transition">Courses</button>
                <button onclick="router.navigate('books')" class="hover:text-indigo-600 transition">Books</button>
                <button onclick="router.navigate('tests')" class="hover:text-indigo-600 transition">Test Series</button>
                <button onclick="router.navigate('solver')" class="text-indigo-600 font-bold bg-indigo-50 px-4 py-2 rounded-full">AI Solver</button>
            </div>

            <button onclick="router.navigate('dashboard')" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 hover:text-indigo-600 transition">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
            </button>
        </div>
    </nav>

    <main id="app-root" class="max-w-7xl mx-auto px-6 py-12 min-h-screen"></main>

    <script type="module">
        let currentFilter = 'all';
        let selectedClass = '10';

        const courses = [
            { id: 1, title: "Class 6 Foundation", cat: "school", price: "1499", tags: ["Maths", "Science"] },
            { id: 4, title: "Class 9 Mastery", cat: "school", price: "2499", tags: ["Science", "Maths"] },
            { id: 5, title: "Class 10 Board Pro", cat: "school", price: "2999", tags: ["PYQs", "Live Mocks"] },
            { id: 8, title: "JEE Mains Special", cat: "engineering", price: "5999", tags: ["Objective", "NTA"] },
            { id: 10, title: "JEE (Mains + Adv)", cat: "engineering", price: "9999", tags: ["Full Course"] },
            { id: 12, title: "NEET Crashcourse", cat: "medical", price: "2999", tags: ["60 Days", "High Yield"] }
        ];

        window.router = {
            navigate: (view, data = null) => {
                const root = document.getElementById('app-root');
                const views = {
                    home: HomeView,
                    courses: CoursesView,
                    books: BooksView,
                    tests: TestsView,
                    solver: SolverView,
                    dashboard: DashboardView
                };
                root.innerHTML = views[view]();
                lucide.createIcons();
                window.scrollTo(0,0);
            }
        };

        // --- Improved Toggle Components ---
        const CategoryToggle = () => `
            <div class="toggle-container">
                <div onclick="setFilter('all')" class="toggle-item ${currentFilter === 'all' ? 'active' : ''}">All</div>
                <div onclick="setFilter('school')" class="toggle-item ${currentFilter === 'school' ? 'active' : ''}">School</div>
                <div onclick="setFilter('engineering')" class="toggle-item ${currentFilter === 'engineering' ? 'active' : ''}">JEE</div>
                <div onclick="setFilter('medical')" class="toggle-item ${currentFilter === 'medical' ? 'active' : ''}">NEET</div>
            </div>
        `;

        const ClassPillToggle = (targetView) => `
            <div class="class-pill-grid">
                ${['6','7','8','9','10','11','12','JEE','NEET'].map(c => `
                    <button onclick="setClass('${c}', '${targetView}')" class="class-pill ${selectedClass === c ? 'active' : ''}">
                        ${isNaN(c) ? c : 'Class ' + c}
                    </button>
                `).join('')}
            </div>
        `;

        // --- Views ---
        const HomeView = () => `
            <div class="py-20 text-center space-y-8">
                <h1 class="text-6xl font-extrabold tracking-tighter">Your Academic <span class="text-indigo-600">Evolution.</span></h1>
                <p class="text-slate-500 max-w-xl mx-auto">Premium coaching for Boards, JEE, and NEET by Gaurav Sir.</p>
                <button onclick="router.navigate('courses')" class="btn-primary px-8 py-4 rounded-2xl font-bold">Start Learning</button>
            </div>
        `;

        const CoursesView = () => {
            const filtered = currentFilter === 'all' ? courses : courses.filter(c => c.cat === currentFilter);
            return `
                <div class="space-y-10">
                    <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                        <h2 class="text-3xl font-bold">Explore <span class="text-indigo-600">Courses</span></h2>
                        ${CategoryToggle()}
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        ${filtered.map(c => `
                            <div class="card-shadow p-8 rounded-[2rem] flex flex-col h-full">
                                <div class="flex gap-2 mb-4">
                                    ${c.tags.map(t => `<span class="text-[10px] font-bold uppercase tracking-widest text-slate-400 bg-slate-100 px-2 py-1 rounded">${t}</span>`).join('')}
                                </div>
                                <h3 class="text-xl font-bold mb-6">${c.title}</h3>
                                <div class="mt-auto flex items-center justify-between">
                                    <span class="text-2xl font-black text-indigo-600">₹${c.price}</span>
                                    <button class="btn-primary px-6 py-2.5 rounded-xl text-sm font-bold">Enroll</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        };

        const BooksView = () => `
            <div class="space-y-10">
                <div class="space-y-6">
                    <h2 class="text-3xl font-bold">Nexus <span class="text-indigo-600">Library</span></h2>
                    ${ClassPillToggle('books')}
                </div>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-6">
                    ${[1,2,3,4,5].map(i => `
                        <div class="group cursor-pointer">
                            <div class="aspect-[3/4] bg-slate-100 rounded-2xl mb-3 flex items-center justify-center border-2 border-transparent group-hover:border-indigo-600 transition">
                                <i data-lucide="book-open" class="text-slate-300 w-10 h-10"></i>
                            </div>
                            <h4 class="font-bold text-sm">Subject Material ${i}</h4>
                            <p class="text-xs text-slate-400 font-bold">Class ${selectedClass}</p>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;

        const TestsView = () => `
            <div class="space-y-10">
                <div class="space-y-6">
                    <h2 class="text-3xl font-bold">Test <span class="text-indigo-600">Series</span></h2>
                    ${ClassPillToggle('tests')}
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div class="card-shadow p-6 rounded-3xl">
                        <h4 class="font-bold text-xs uppercase text-slate-400 tracking-widest mb-4">Chapter Wise</h4>
                        <div class="p-4 bg-slate-50 rounded-2xl flex justify-between items-center">
                            <span class="font-bold text-sm">Physics Mock 1</span>
                            <span class="text-indigo-600 font-bold">₹49</span>
                        </div>
                    </div>
                </div>
            </div>
        `;

        const SolverView = () => `<div class="py-20 text-center"><h2 class="text-3xl font-bold">AI Solver</h2></div>`;
        const DashboardView = () => `<div class="py-20 text-center"><h2 class="text-3xl font-bold">Dashboard</h2></div>`;

        // --- Update Functions ---
        window.setFilter = (f) => {
            currentFilter = f;
            router.navigate('courses');
        };

        window.setClass = (c, view) => {
            selectedClass = c;
            router.navigate(view);
        };

        router.navigate('home');
    </script>
</body>
</html>
