<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav Classes | Nexus 2.0 Academy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg-primary: #050810;
            --bg-secondary: #0f172a;
            --accent-cyan: #22d3ee;
            --accent-indigo: #6366f1;
            --glass: rgba(15, 23, 42, 0.8);
            --border: rgba(255, 255, 255, 0.08);
        }

        body { font-family: 'Syne', sans-serif; background: var(--bg-primary); color: #f8fafc; overflow-x: hidden; }
        h1, h2, h3, .font-heading { font-family: 'Orbitron', sans-serif; }

        .mesh-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(34, 211, 238, 0.12) 0px, transparent 50%);
        }

        .glass-card {
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover { border-color: var(--accent-cyan); transform: translateY(-5px); box-shadow: 0 20px 40px -20px rgba(34, 211, 238, 0.3); }

        .class-toggle {
            @apply px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all border border-white/5;
            background: rgba(255,255,255,0.03);
        }
        .class-toggle.active {
            @apply bg-indigo-600 border-indigo-500 shadow-lg shadow-indigo-500/20 text-white;
        }

        .shimmer-btn {
            background: linear-gradient(90deg, #6366f1, #22d3ee, #6366f1);
            background-size: 200%;
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer { 0% { background-position: 0%; } 100% { background-position: 200%; } }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--accent-indigo); border-radius: 10px; }
    </style>
</head>
<body>
    <div class="mesh-bg"></div>

    <header class="sticky top-0 z-[100] px-8 py-4 glass-card mx-4 mt-4 rounded-3xl flex justify-between items-center">
        <div class="flex items-center gap-3 cursor-pointer" onclick="router.navigate('home')">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center">
                <i data-lucide="shield-check" class="text-white w-6 h-6"></i>
            </div>
            <span class="font-heading font-black tracking-tighter text-lg uppercase">Gaurav <span class="text-cyan-400">Classes</span></span>
        </div>

        <nav id="main-nav" class="hidden lg:flex gap-8 items-center text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">
            <button onclick="router.navigate('courses')" class="hover:text-cyan-400 transition">Courses</button>
            <button onclick="router.navigate('books')" class="hover:text-cyan-400 transition">Book Store</button>
            <button onclick="router.navigate('dashboard')" class="hover:text-cyan-400 transition">Dashboard</button>
        </nav>

        <div id="user-zone" class="flex items-center gap-4"></div>
    </header>

    <main id="app-root" class="max-w-7xl mx-auto px-6 py-12 min-h-screen">
        </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ── REPLACE WITH YOUR FIREBASE CONFIG ──
        const firebaseConfig = { apiKey: "...", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..." };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let selectedClass = "10";
        let products = []; // Courses + Books from Firestore

        // ── ROUTER ──
        window.router = {
            navigate: (view) => {
                const root = document.getElementById('app-root');
                window.scrollTo(0,0);
                
                if(view === 'home') root.innerHTML = HomeView();
                if(view === 'courses') root.innerHTML = CoursesView();
                if(view === 'books') root.innerHTML = BooksView();
                if(view === 'checkout') root.innerHTML = CheckoutView();
                
                lucide.createIcons();
            }
        };

        // ── COMPONENTS ──

        const HomeView = () => `
            <section class="py-20 text-center space-y-12">
                <div class="inline-block px-4 py-1 rounded-full border border-cyan-500/20 bg-cyan-500/5 text-cyan-400 text-[10px] font-black tracking-widest uppercase">Premium EdTech Ecosystem</div>
                <h1 class="text-6xl md:text-8xl font-black uppercase tracking-tighter leading-none">Elevate Your <br> <span class="text-indigo-500">Academic Rank</span></h1>
                <p class="text-slate-500 max-w-2xl mx-auto text-lg">Gaurav Classes provides high-fidelity coaching for Board Exams, Engineering (JEE/Polytechnic), and Medical (NEET) entries.</p>
                <div class="flex justify-center gap-6">
                    <button onclick="router.navigate('courses')" class="shimmer-btn px-12 py-5 rounded-2xl font-black uppercase text-xs tracking-widest shadow-2xl">View Courses</button>
                    <button onclick="router.navigate('books')" class="glass-card px-12 py-5 rounded-2xl font-black uppercase text-xs tracking-widest">Digital Bookstore</button>
                </div>
            </section>
        `;

        const CoursesView = () => `
            <div class="space-y-16">
                <div class="text-center">
                    <h2 class="text-4xl font-black uppercase tracking-tighter mb-2">Available <span class="text-indigo-500">Courses</span></h2>
                    <p class="text-slate-500 text-sm">Targeted syllabus for all major Indian examinations.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    ${renderCourseCard("Class 6-8 Foundation", "₹2,499", "Primary Schooling Essentials", "indigo")}
                    ${renderCourseCard("Class 9-10 Boards", "₹4,999", "CBSE/UP/ICSE Specialized", "cyan")}
                    ${renderCourseCard("Class 11-12 PCBM", "₹7,999", "Higher Secondary Mastery", "orange")}
                    ${renderCourseCard("JEE Main + Advanced", "₹14,999", "IIT Preparation Module", "indigo")}
                    ${renderCourseCard("NEET UG Pro", "₹12,999", "Medical Entrance System", "rose")}
                    ${renderCourseCard("Polytechnic Entrance", "₹3,499", "State Level Tech Prep", "emerald")}
                </div>
            </div>
        `;

        const BooksView = () => {
            const classes = ["6","7","8","9","10","11","12","JEE","NEET","Poly"];
            return `
                <div class="space-y-12">
                    <div class="flex flex-col md:flex-row justify-between items-end gap-6">
                        <div>
                            <h2 class="text-3xl font-black uppercase tracking-tighter">Nexus <span class="text-cyan-400">Bookstore</span></h2>
                            <p class="text-slate-500 text-xs mt-1 uppercase font-bold tracking-widest">Official Modules & NCERT Repository</p>
                        </div>
                        <div class="flex flex-wrap gap-2 justify-end max-w-xl">
                            ${classes.map(c => `
                                <button onclick="setBookClass('${c}')" class="class-toggle ${selectedClass === c ? 'active' : ''}">${c === 'Poly' ? 'Polytechnic' : 'Class ' + c}</button>
                            `).join('')}
                        </div>
                    </div>

                    <section class="glass-card p-10 rounded-[3rem] border-cyan-500/20 bg-cyan-500/5">
                        <div class="flex items-center gap-4 mb-8">
                            <div class="p-3 bg-cyan-500 rounded-2xl shadow-lg shadow-cyan-500/20">
                                <i data-lucide="library" class="text-black w-6 h-6"></i>
                            </div>
                            <h3 class="text-xl font-black uppercase tracking-tight">NCERT Digital Vault (Class ${selectedClass})</h3>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                            ${renderBookCard(`NCERT Mathematics - Class ${selectedClass}`, "Official", "FREE", true)}
                            ${renderBookCard(`NCERT Science/Physics - Class ${selectedClass}`, "Official", "FREE", true)}
                            ${renderBookCard(`NCERT English - Class ${selectedClass}`, "Official", "FREE", true)}
                        </div>
                    </section>

                    <section class="space-y-8">
                        <h3 class="text-xl font-black uppercase tracking-tight flex items-center gap-3">
                            <i data-lucide="star" class="text-orange-500 w-5 h-5"></i> Gaurav Sir's Special Modules
                        </h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                            ${renderBookCard(`Concept Mastery: Class ${selectedClass} Maths`, "Gaurav Sir", "₹499", false)}
                            ${renderBookCard(`Numerical Punch: Class ${selectedClass} Physics`, "Gaurav Sir", "₹599", false)}
                            ${renderBookCard(`Exam Ready Mock Papers`, "Nexus Team", "₹299", false)}
                        </div>
                    </section>
                </div>
            `;
        };

        // ── HELPERS ──

        function renderCourseCard(title, price, desc, color) {
            return `
                <div class="glass-card p-8 rounded-[2.5rem] space-y-6 flex flex-col group">
                    <div class="w-12 h-12 rounded-2xl bg-${color}-500/20 flex items-center justify-center border border-${color}-500/30">
                        <i data-lucide="zap" class="text-${color}-500 w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="text-xl font-bold mb-2 group-hover:text-cyan-400 transition">${title}</h3>
                        <p class="text-slate-500 text-xs font-medium">${desc}</p>
                    </div>
                    <div class="flex justify-between items-end pt-4 flex-grow">
                        <span class="text-2xl font-black">${price}</span>
                        <button class="px-6 py-3 bg-white/5 border border-white/10 rounded-xl text-[10px] font-black uppercase hover:bg-white/10 transition">Enroll Now</button>
                    </div>
                </div>
            `;
        }

        function renderBookCard(title, author, price, isNcert) {
            return `
                <div class="glass-card p-5 rounded-[2rem] group flex flex-col h-full bg-slate-900/30">
                    <div class="w-full aspect-[3/4] rounded-2xl bg-slate-800 mb-4 overflow-hidden relative">
                        <div class="absolute top-3 right-3 px-2 py-1 bg-black/50 backdrop-blur rounded text-[8px] font-black text-white uppercase">${isNcert ? 'NCERT' : 'Exclusive'}</div>
                        <div class="w-full h-full flex items-center justify-center opacity-20 group-hover:opacity-100 transition duration-500">
                            <i data-lucide="book" class="w-16 h-16 text-indigo-400"></i>
                        </div>
                    </div>
                    <h4 class="font-bold text-sm mb-1 leading-tight line-clamp-2">${title}</h4>
                    <p class="text-[10px] text-slate-500 font-bold uppercase mb-4 tracking-tighter">By ${author}</p>
                    <div class="mt-auto flex justify-between items-center">
                        <span class="text-sm font-black ${isNcert ? 'text-cyan-400' : ''}">${price}</span>
                        <button class="p-2 rounded-lg bg-indigo-600/10 text-indigo-400 hover:bg-indigo-600 hover:text-white transition">
                            <i data-lucide="${isNcert ? 'download' : 'shopping-cart'}" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        window.setBookClass = (c) => {
            selectedClass = c;
            router.navigate('books');
        };

        window.handleLogout = () => signOut(auth).then(() => location.reload());

        // ── INIT ──
        onAuthStateChanged(auth, user => {
            currentUser = user;
            const zone = document.getElementById('user-zone');
            zone.innerHTML = user 
                ? `<button onclick="handleLogout()" class="px-6 py-2 bg-white/5 border border-white/10 rounded-full text-[10px] font-black uppercase tracking-widest hover:text-rose-500 transition">Logout</button>`
                : `<button onclick="router.navigate('auth')" class="px-8 py-2 bg-indigo-600 rounded-full text-[10px] font-black uppercase tracking-widest shadow-lg shadow-indigo-500/20">Login</button>`;
            
            router.navigate('home');
        });

    </script>
</body>
</html>
