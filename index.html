<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav Classes | Nexus 2.0 Academy</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg-primary: #050810;
            --bg-secondary: #0f172a;
            --accent-cyan: #22d3ee;
            --accent-indigo: #6366f1;
            --accent-emerald: #10b981;
            --glass: rgba(15, 23, 42, 0.8);
            --border: rgba(255, 255, 255, 0.08);
        }

        body { font-family: 'Syne', sans-serif; background: var(--bg-primary); color: #f8fafc; overflow-x: hidden; }
        h1, h2, h3, .font-heading { font-family: 'Orbitron', sans-serif; }

        .mesh-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(34, 211, 238, 0.12) 0px, transparent 50%);
        }

        .glass-card {
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover { border-color: var(--accent-cyan); transform: translateY(-5px); box-shadow: 0 20px 40px -20px rgba(34, 211, 238, 0.3); }

        .class-toggle {
            @apply px-4 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all border border-white/5;
            background: rgba(255,255,255,0.03);
        }
        .class-toggle.active {
            @apply bg-indigo-600 border-indigo-500 shadow-lg shadow-indigo-500/20 text-white;
        }

        input, select, textarea {
            background: rgba(255,255,255,0.05) !important;
            border: 1px solid var(--border) !important;
            color: white !important;
            border-radius: 12px !important;
            padding: 14px 16px !important;
            outline: none;
            transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-cyan) !important; background: rgba(255,255,255,0.08) !important; }

        .shimmer-btn {
            background: linear-gradient(90deg, #6366f1, #22d3ee, #6366f1);
            background-size: 200%;
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer { 0% { background-position: 0%; } 100% { background-position: 200%; } }

        .ai-glow { animation: pulse-glow 2s infinite; }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px rgba(34, 211, 238, 0.2); } 50% { box-shadow: 0 0 40px rgba(34, 211, 238, 0.5); } }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--accent-indigo); border-radius: 10px; }
    </style>
</head>
<body>
    <div class="mesh-bg"></div>

    <header class="sticky top-0 z-[100] px-8 py-4 glass-card mx-4 mt-4 rounded-3xl flex justify-between items-center">
        <div class="flex items-center gap-3 cursor-pointer" onclick="router.navigate('home')">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center">
                <i data-lucide="shield-check" class="text-white w-6 h-6"></i>
            </div>
            <span class="font-heading font-black tracking-tighter text-lg uppercase">Gaurav <span class="text-cyan-400">Classes</span></span>
        </div>

        <nav id="main-nav" class="hidden lg:flex gap-6 items-center text-[9px] font-black uppercase tracking-[0.2em] text-slate-400">
            <button onclick="router.navigate('courses')" class="hover:text-cyan-400 transition">Courses</button>
            <button onclick="router.navigate('books')" class="hover:text-cyan-400 transition">Books</button>
            <button onclick="router.navigate('tests')" class="hover:text-cyan-400 transition">Test Series</button>
            <button onclick="router.navigate('solver')" class="px-4 py-2 bg-white/5 rounded-xl border border-white/10 text-cyan-400 hover:bg-cyan-500/10 transition flex items-center gap-2">
                <i data-lucide="sparkles" class="w-3 h-3"></i> AI Solver
            </button>
            <button onclick="router.navigate('dashboard')" class="hover:text-cyan-400 transition">Dashboard</button>
        </nav>

        <div id="user-zone" class="flex items-center gap-4"></div>
    </header>

    <main id="app-root" class="max-w-7xl mx-auto px-6 py-12 min-h-screen">
        </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ── CONFIGURATION ──
        const firebaseConfig = { apiKey: "YOUR_API_KEY", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..." };
        const ADMIN_UID = "ADMIN_ID_HERE";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let selectedClass = "10";
        let currentAuthMode = 'REGISTER';

        // ── ROUTER ──
        window.router = {
            navigate: (view) => {
                const root = document.getElementById('app-root');
                window.scrollTo(0,0);
                
                if(view === 'home') root.innerHTML = HomeView();
                if(view === 'courses') root.innerHTML = CoursesView();
                if(view === 'books') root.innerHTML = BooksView();
                if(view === 'tests') root.innerHTML = TestSeriesView();
                if(view === 'solver') root.innerHTML = DoubtSolverView();
                if(view === 'auth') root.innerHTML = AuthView();
                
                lucide.createIcons();
            }
        };

        // ── COMPONENTS ──

        const HomeView = () => `
            <section class="py-20 text-center space-y-12">
                <div class="inline-block px-4 py-1 rounded-full border border-cyan-500/20 bg-cyan-500/5 text-cyan-400 text-[10px] font-black tracking-widest uppercase">Premium EdTech Ecosystem</div>
                <h1 class="text-6xl md:text-8xl font-black uppercase tracking-tighter leading-none">Elevate Your <br> <span class="text-indigo-500">Academic Rank</span></h1>
                <p class="text-slate-500 max-w-2xl mx-auto text-lg">Gaurav Classes provides high-fidelity coaching for Board Exams, Engineering (JEE/Polytechnic), and Medical (NEET) entries.</p>
                <div class="flex justify-center gap-6">
                    <button onclick="router.navigate('courses')" class="shimmer-btn px-12 py-5 rounded-2xl font-black uppercase text-xs tracking-widest shadow-2xl">Start Learning</button>
                    <button onclick="router.navigate('solver')" class="glass-card px-12 py-5 rounded-2xl font-black uppercase text-xs tracking-widest flex items-center gap-3">
                        <i data-lucide="cpu"></i> AI Help
                    </button>
                </div>
            </section>
        `;

        const TestSeriesView = () => `
            <div class="space-y-16">
                <div class="text-center">
                    <h2 class="text-4xl font-black uppercase tracking-tighter mb-2">Nexus <span class="text-cyan-400">Test Engine</span></h2>
                    <p class="text-slate-500 text-xs font-bold uppercase tracking-[0.3em]">Evaluation System for Class ${selectedClass}</p>
                </div>

                <section class="space-y-8">
                    <div class="flex items-center gap-3 border-l-4 border-indigo-500 pl-4">
                        <h3 class="text-xl font-black uppercase tracking-tight">Chapter-Wise Assessment</h3>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        ${renderTestCard("Physics: Light & Reflection", "15 Quests", "₹49", "indigo")}
                        ${renderTestCard("Maths: Trigonometry Pro", "20 Quests", "₹49", "indigo")}
                        ${renderTestCard("Chemistry: Periodic Trends", "15 Quests", "₹49", "indigo")}
                    </div>
                </section>

                <section class="space-y-8">
                    <div class="flex items-center gap-3 border-l-4 border-cyan-500 pl-4">
                        <h3 class="text-xl font-black uppercase tracking-tight">Full-Length Model Papers</h3>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        ${renderTestCard("Board Pattern Mock: Set A", "3 Hours | 80 Marks", "₹149", "cyan")}
                        ${renderTestCard("Board Pattern Mock: Set B", "3 Hours | 80 Marks", "₹149", "cyan")}
                    </div>
                </section>

                <section class="space-y-8">
                    <div class="flex items-center gap-3 border-l-4 border-emerald-500 pl-4">
                        <h3 class="text-xl font-black uppercase tracking-tight">Previous Year Archives (10 Years)</h3>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                        ${renderTestCard("2024 Solved PYQ", "Official", "₹99", "emerald")}
                        ${renderTestCard("2023 Solved PYQ", "Official", "₹99", "emerald")}
                        ${renderTestCard("2022 Solved PYQ", "Official", "₹99", "emerald")}
                        ${renderTestCard("Topic-wise PYQ Bundle", "Hot Item", "₹299", "emerald")}
                    </div>
                </section>
            </div>
        `;

        const DoubtSolverView = () => `
            <div class="max-w-4xl mx-auto space-y-10">
                <div class="text-center space-y-4">
                    <div class="w-20 h-20 bg-cyan-500/10 rounded-full mx-auto flex items-center justify-center ai-glow border border-cyan-500/20">
                        <i data-lucide="brain-circuit" class="text-cyan-400 w-10 h-10"></i>
                    </div>
                    <h2 class="text-4xl font-black uppercase tracking-tighter">AI <span class="text-indigo-500">Doubt Solver</span></h2>
                    <p class="text-slate-500 text-sm">Snap a photo or type your question. Gaurav Classes AI will explain the solution step-by-step.</p>
                </div>

                <div class="glass-card p-8 rounded-[3rem] space-y-6">
                    <textarea id="ai-input" placeholder="Paste your question here or describe your doubt..." class="w-full h-40 resize-none text-lg"></textarea>
                    
                    <div class="flex flex-col md:flex-row gap-4 items-center">
                        <button class="w-full md:w-auto px-8 py-4 bg-white/5 border border-white/10 rounded-2xl flex items-center justify-center gap-3 hover:bg-white/10 transition uppercase text-[10px] font-black tracking-widest">
                            <i data-lucide="camera" class="w-4 h-4"></i> Upload Image
                        </button>
                        <button onclick="simulateAISolver()" class="flex-grow py-4 shimmer-btn rounded-2xl uppercase text-[10px] font-black tracking-widest shadow-xl">
                            Analyze & Solve
                        </button>
                    </div>
                </div>

                <div id="ai-response" class="hidden glass-card p-10 rounded-[3rem] border-cyan-500/30 bg-cyan-500/5 animate-in fade-in duration-700">
                    <div class="flex items-center gap-3 mb-6">
                        <span class="px-3 py-1 bg-cyan-500 text-black text-[8px] font-black rounded-full uppercase">AI Analysis</span>
                        <div class="h-[1px] flex-grow bg-cyan-500/20"></div>
                    </div>
                    <div id="ai-text-result" class="prose prose-invert max-w-none text-slate-300">
                        </div>
                </div>
            </div>
        `;

        const BooksView = () => {
            const classes = ["6","7","8","9","10","11","12","JEE","NEET","Poly"];
            return `
                <div class="space-y-12">
                    <div class="flex flex-col md:flex-row justify-between items-end gap-6">
                        <div>
                            <h2 class="text-3xl font-black uppercase tracking-tighter">Nexus <span class="text-cyan-400">Bookstore</span></h2>
                            <p class="text-slate-500 text-xs mt-1 uppercase font-bold tracking-widest">Official Modules & NCERT Repository</p>
                        </div>
                        <div class="flex flex-wrap gap-2 justify-end max-w-xl">
                            ${classes.map(c => `<button onclick="setBookClass('${c}')" class="class-toggle ${selectedClass === c ? 'active' : ''}">${c === 'Poly' ? 'Poly' : 'Class ' + c}</button>`).join('')}
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                        ${renderBookCard(`NCERT Maths - ${selectedClass}`, "Official", "FREE", true)}
                        ${renderBookCard(`Concept Mastery: Physics`, "Gaurav Sir", "₹499", false)}
                        ${renderBookCard(`Numerical Punch: Science`, "Gaurav Sir", "₹599", false)}
                        ${renderBookCard(`Nexus Formula Sheet`, "Nexus Team", "₹199", false)}
                    </div>
                </div>
            `;
        };

        // ── HELPERS ──
        function renderTestCard(title, meta, price, color) {
            return `
                <div class="glass-card p-6 rounded-[2rem] space-y-4 group">
                    <div class="flex justify-between items-start">
                        <div class="p-3 bg-${color}-500/10 rounded-xl border border-${color}-500/20">
                            <i data-lucide="clipboard-list" class="text-${color}-500 w-5 h-5"></i>
                        </div>
                        <span class="text-[10px] font-black text-slate-500 uppercase">${meta}</span>
                    </div>
                    <h4 class="font-bold text-sm h-10 line-clamp-2">${title}</h4>
                    <div class="flex justify-between items-center pt-2">
                        <span class="font-black text-lg">${price}</span>
                        <button class="px-4 py-2 bg-${color}-500 text-black text-[9px] font-black rounded-lg uppercase shadow-lg shadow-${color}-500/20 hover:scale-105 transition">Buy Test</button>
                    </div>
                </div>
            `;
        }

        function renderBookCard(title, author, price, isNcert) {
            return `
                <div class="glass-card p-5 rounded-[2rem] group flex flex-col h-full bg-slate-900/30">
                    <div class="w-full aspect-[3/4] rounded-2xl bg-slate-800 mb-4 overflow-hidden relative">
                        <div class="absolute top-3 right-3 px-2 py-1 bg-black/50 backdrop-blur rounded text-[8px] font-black text-white uppercase">${isNcert ? 'NCERT' : 'Exclusive'}</div>
                        <div class="w-full h-full flex items-center justify-center opacity-20 group-hover:opacity-100 transition duration-500"><i data-lucide="book" class="w-16 h-16 text-indigo-400"></i></div>
                    </div>
                    <h4 class="font-bold text-sm mb-1 line-clamp-2">${title}</h4>
                    <p class="text-[10px] text-slate-500 font-bold uppercase mb-4 tracking-tighter">By ${author}</p>
                    <div class="mt-auto flex justify-between items-center"><span class="text-sm font-black ${isNcert ? 'text-cyan-400' : ''}">${price}</span>
                        <button class="p-2 rounded-lg bg-indigo-600/10 text-indigo-400 hover:bg-indigo-600 hover:text-white transition"><i data-lucide="${isNcert ? 'download' : 'shopping-cart'}" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `;
        }

        // ── LOGIC ──
        window.simulateAISolver = () => {
            const input = document.getElementById('ai-input').value;
            if(!input) return alert("Please enter a question first.");
            
            const res = document.getElementById('ai-response');
            const text = document.getElementById('ai-text-result');
            
            res.classList.remove('hidden');
            text.innerHTML = `<p class="animate-pulse">Analyzing problem space...</p>`;
            
            setTimeout(() => {
                text.innerHTML = `
                    <h4 class="text-white font-bold mb-2">Step-by-Step Solution:</h4>
                    <p class="mb-4">Based on the concept of <strong>Calculus/Mechanics</strong>, we first identify the constants...</p>
                    <div class="p-4 bg-white/5 rounded-xl border border-white/10 font-mono text-sm mb-4">
                        Let v = u + at <br>
                        Substituting values: 20 = 0 + (9.8)t <br>
                        t = 2.04 seconds
                    </div>
                    <p class="text-cyan-400 text-xs font-bold uppercase italic">Solution Verified by Nexus AI System</p>
                `;
            }, 2000);
        };

        window.setBookClass = (c) => { selectedClass = c; router.navigate('books'); };
        window.handleLogout = () => signOut(auth).then(() => location.reload());

        // ── AUTH INITIALIZATION ──
        onAuthStateChanged(auth, user => {
            currentUser = user;
            const zone = document.getElementById('user-zone');
            zone.innerHTML = user 
                ? `<button onclick="handleLogout()" class="px-6 py-2 bg-white/5 border border-white/10 rounded-full text-[10px] font-black uppercase tracking-widest hover:text-rose-500 transition">Logout</button>`
                : `<button onclick="router.navigate('auth')" class="px-8 py-2 bg-indigo-600 rounded-full text-[10px] font-black uppercase tracking-widest">Login</button>`;
            
            router.navigate('home');
        });

    </script>
</body>
</html>
