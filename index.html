<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav Classes | Nexus Management System</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; --glass: rgba(255, 255, 255, 0.9); }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: #1e293b; transition: 0.3s; }
        h1, h2, h3, .font-heading { font-family: 'Outfit', sans-serif; }

        .card-neo { background: white; border: 1px solid #e2e8f0; border-radius: 24px; transition: all 0.3s ease; }
        .card-neo:hover { border-color: var(--primary); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.04); }

        .input-field { @apply w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-indigo-600 focus:bg-white transition-all; }
        
        /* Toggles */
        .toggle-box { @apply inline-flex bg-slate-100 p-1 rounded-2xl border border-slate-200; }
        .toggle-btn { @apply px-5 py-2 rounded-xl text-xs font-bold transition-all cursor-pointer; }
        .toggle-btn.active { @apply bg-white text-indigo-600 shadow-sm; }

        .admin-sidebar { width: 280px; border-right: 1px solid #e2e8f0; height: calc(100vh - 80px); position: sticky; top: 80px; }
        
        .btn-grad { background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%); color: white; @apply shadow-lg shadow-indigo-100; }
        
        /* Progress Bar */
        .progress-ring { height: 6px; background: #e2e8f0; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); border-radius: 10px; }
    </style>
</head>
<body>

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="router.navigate('home')">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-200">
                    <i data-lucide="graduation-cap" class="text-white w-6 h-6"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">Gaurav<span class="text-indigo-600">Classes</span></span>
            </div>

            <div class="hidden lg:flex items-center gap-8 text-sm font-semibold text-slate-500">
                <button onclick="router.navigate('courses')" class="hover:text-indigo-600 transition">Courses</button>
                <button onclick="router.navigate('books')" class="hover:text-indigo-600 transition">Books</button>
                <button onclick="router.navigate('tests')" class="hover:text-indigo-600 transition">Test Series</button>
                <button onclick="router.navigate('solver')" class="text-indigo-600 bg-indigo-50 px-4 py-2 rounded-full">AI Solver</button>
            </div>

            <div class="flex items-center gap-4">
                <button onclick="router.navigate('admin')" class="p-2 text-slate-400 hover:text-indigo-600"><i data-lucide="shield-check"></i></button>
                <button onclick="router.navigate('auth')" class="btn-grad px-6 py-2.5 rounded-full text-sm font-bold">Get Started</button>
            </div>
        </div>
    </nav>

    <main id="app-root" class="max-w-7xl mx-auto px-6 py-10 min-h-screen"></main>

    <script type="module">
        let currentFilter = 'all';
        let selectedClass = '10';
        let authMode = 'login'; // login or register

        window.router = {
            navigate: (view, data = null) => {
                const root = document.getElementById('app-root');
                const views = {
                    home: HomeView,
                    courses: CoursesView,
                    books: BooksView,
                    tests: TestsView,
                    solver: SolverView,
                    dashboard: DashboardView,
                    checkout: () => CheckoutView(data),
                    auth: AuthView,
                    admin: AdminView
                };
                root.innerHTML = views[view]();
                lucide.createIcons();
                window.scrollTo(0,0);
            }
        };

        // --- AUTH VIEW ---
        const AuthView = () => `
            <div class="max-w-md mx-auto py-12">
                <div class="card-neo p-10 space-y-8">
                    <div class="text-center space-y-2">
                        <h2 class="text-3xl font-extrabold">${authMode === 'login' ? 'Welcome Back' : 'Create Account'}</h2>
                        <p class="text-slate-400 text-sm">Join the elite learning community</p>
                    </div>
                    <div class="space-y-4">
                        ${authMode === 'register' ? '<input type="text" placeholder="Full Name" class="input-field">' : ''}
                        <input type="email" placeholder="Email Address" class="input-field">
                        <input type="password" placeholder="Password" class="input-field">
                        <button onclick="router.navigate('dashboard')" class="w-full btn-grad py-4 rounded-2xl font-bold">
                            ${authMode === 'login' ? 'Sign In' : 'Register Now'}
                        </button>
                    </div>
                    <p class="text-center text-sm font-semibold text-slate-500">
                        ${authMode === 'login' ? "Don't have an account?" : "Already have an account?"}
                        <span class="text-indigo-600 cursor-pointer" onclick="toggleAuth()">${authMode === 'login' ? 'Register' : 'Login'}</span>
                    </p>
                </div>
            </div>
        `;

        // --- STUDENT DASHBOARD ---
        const DashboardView = () => `
            <div class="space-y-10">
                <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h1 class="text-3xl font-bold">Student <span class="text-indigo-600">Pulse</span></h1>
                        <p class="text-slate-400">Welcome back, Gaurav. Ready for today's goal?</p>
                    </div>
                    <div class="flex gap-4">
                        <div class="text-right">
                            <p class="text-xs font-bold text-slate-400 uppercase">Rank</p>
                            <p class="font-bold">#24 (Batch A)</p>
                        </div>
                        <div class="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600"><i data-lucide="award"></i></div>
                    </div>
                </header>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="card-neo p-6 bg-indigo-600 text-white col-span-1 md:col-span-2">
                        <h4 class="font-bold opacity-80 mb-2">Ongoing Course</h4>
                        <h2 class="text-2xl font-bold mb-6">Physics Mastery: Class 12</h2>
                        <div class="space-y-2">
                            <div class="flex justify-between text-sm font-bold"><span>Course Completion</span><span>68%</span></div>
                            <div class="progress-ring bg-white/20"><div class="progress-fill bg-white" style="width: 68%"></div></div>
                        </div>
                    </div>
                    <div class="card-neo p-6">
                        <i data-lucide="book-open" class="text-indigo-600 mb-4"></i>
                        <h4 class="text-2xl font-bold">14</h4>
                        <p class="text-slate-400 text-sm font-semibold">Active Books</p>
                    </div>
                    <div class="card-neo p-6">
                        <i data-lucide="clock" class="text-emerald-500 mb-4"></i>
                        <h4 class="text-2xl font-bold">120h</h4>
                        <p class="text-slate-400 text-sm font-semibold">Watch Time</p>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 space-y-6">
                        <h3 class="font-bold text-xl">Recent Lectures</h3>
                        ${[1,2,3].map(i => `
                            <div class="card-neo p-4 flex items-center justify-between">
                                <div class="flex items-center gap-4">
                                    <div class="w-12 h-12 bg-slate-100 rounded-xl flex items-center justify-center"><i data-lucide="play" class="w-5 h-5"></i></div>
                                    <div><p class="font-bold text-sm">Chapter ${i}: Quantum Mechanics</p><p class="text-xs text-slate-400">45 Minutes • Physics</p></div>
                                </div>
                                <button class="p-2 hover:bg-indigo-50 rounded-lg text-indigo-600"><i data-lucide="download"></i></button>
                            </div>
                        `).join('')}
                    </div>
                    <div class="card-neo p-8 space-y-6">
                        <h3 class="font-bold text-xl">Test Performance</h3>
                        <div class="space-y-4">
                            <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl">
                                <span class="text-sm font-bold">Algebra Mock</span>
                                <span class="px-3 py-1 bg-emerald-100 text-emerald-600 rounded-full text-[10px] font-bold">92%</span>
                            </div>
                            <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl">
                                <span class="text-sm font-bold">Thermodynamics</span>
                                <span class="px-3 py-1 bg-amber-100 text-amber-600 rounded-full text-[10px] font-bold">74%</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;

        // --- ADMIN PANEL ---
        const AdminView = () => `
            <div class="flex flex-col lg:flex-row gap-10">
                <aside class="w-full lg:w-64 space-y-8">
                    <div class="space-y-2">
                        <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest px-4">Management</h3>
                        <nav class="space-y-1">
                            <div class="p-4 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center gap-3 font-bold cursor-pointer"><i data-lucide="layout-grid"></i> Dashboard</div>
                            <div class="p-4 hover:bg-slate-50 rounded-2xl flex items-center gap-3 font-bold cursor-pointer text-slate-500"><i data-lucide="video"></i> Lectures</div>
                            <div class="p-4 hover:bg-slate-50 rounded-2xl flex items-center gap-3 font-bold cursor-pointer text-slate-500"><i data-lucide="file-text"></i> PDF Modules</div>
                            <div class="p-4 hover:bg-slate-50 rounded-2xl flex items-center gap-3 font-bold cursor-pointer text-slate-500"><i data-lucide="users"></i> Students</div>
                        </nav>
                    </div>
                </aside>

                <div class="flex-1 space-y-10">
                    <div class="flex justify-between items-end">
                        <h2 class="text-3xl font-bold">Admin <span class="text-indigo-600">Console</span></h2>
                        <button class="btn-grad px-6 py-3 rounded-2xl text-sm font-bold flex items-center gap-2"><i data-lucide="plus"></i> New Course</button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="card-neo p-8 space-y-6">
                            <h3 class="font-bold flex items-center gap-2"><i data-lucide="upload-cloud" class="text-indigo-600"></i> Upload Center</h3>
                            <div class="space-y-4">
                                <input type="text" placeholder="Lecture / PDF Title" class="input-field">
                                <select class="input-field"><option>Select Course</option><option>JEE Main</option><option>Class 10</option></select>
                                <div class="border-2 border-dashed border-slate-200 p-10 rounded-3xl text-center space-y-3 cursor-pointer hover:border-indigo-400 transition">
                                    <i data-lucide="image" class="mx-auto text-slate-300"></i>
                                    <p class="text-sm font-bold text-slate-400">Drag files or browse to upload</p>
                                </div>
                                <button class="w-full py-4 bg-slate-900 text-white rounded-2xl font-bold">Upload & Sync</button>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="card-neo p-6 text-center">
                                <p class="text-xs font-bold text-slate-400 uppercase">Total Revenue</p>
                                <h4 class="text-2xl font-black mt-2">₹1.4L</h4>
                            </div>
                            <div class="card-neo p-6 text-center">
                                <p class="text-xs font-bold text-slate-400 uppercase">New Users</p>
                                <h4 class="text-2xl font-black mt-2">+48</h4>
                            </div>
                            <div class="card-neo p-8 col-span-2">
                                <h4 class="font-bold mb-4">Pending Doubts</h4>
                                <div class="flex -space-x-3 overflow-hidden">
                                    ${[1,2,3,4,5].map(() => `<div class="inline-block h-10 w-10 rounded-full ring-4 ring-white bg-slate-200"></div>`).join('')}
                                    <div class="h-10 w-10 rounded-full bg-indigo-100 flex items-center justify-center text-[10px] font-bold text-indigo-600">+12</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;

        const CheckoutView = (item) => `
            <div class="max-w-4xl mx-auto py-10">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                    <div class="space-y-8">
                        <h2 class="text-3xl font-bold">Secure <span class="text-indigo-600">Payment</span></h2>
                        <div class="card-neo p-8 bg-indigo-50 border-indigo-200 flex items-center gap-4">
                            <div class="w-12 h-12 bg-indigo-600 text-white rounded-xl flex items-center justify-center"><i data-lucide="shield-check"></i></div>
                            <div><p class="font-bold">Encrypted Transaction</p><p class="text-xs text-indigo-400 font-bold uppercase">100% Student Data Protection</p></div>
                        </div>
                        <div class="space-y-4">
                            <input type="text" placeholder="Full Billing Name" class="input-field">
                            <div class="grid grid-cols-2 gap-4"><input type="text" placeholder="Email" class="input-field"><input type="text" placeholder="Phone" class="input-field"></div>
                        </div>
                    </div>
                    <div class="card-neo p-8 bg-slate-900 text-white flex flex-col">
                        <h4 class="text-xs font-bold uppercase opacity-40 mb-8 tracking-widest">Order Summary</h4>
                        <div class="flex justify-between items-start mb-4">
                            <div><h3 class="text-xl font-bold">${item?.name || 'Class 10 Pro Course'}</h3><p class="text-sm opacity-60">Full Academic Year Access</p></div>
                            <span class="text-xl font-bold">₹${item?.price || '2999'}</span>
                        </div>
                        <div class="mt-auto border-t border-white/10 pt-6 flex justify-between items-center">
                            <span class="opacity-60 text-sm font-bold uppercase">Total Payable</span>
                            <span class="text-4xl font-black text-indigo-400">₹${item?.price || '2999'}</span>
                        </div>
                        <button onclick="alert('Payment Gateway Loading...')" class="w-full mt-8 btn-grad py-5 rounded-2xl font-black uppercase text-xs tracking-widest">Complete Purchase</button>
                    </div>
                </div>
            </div>
        `;

        // Standard Utility Views (Home, Courses, etc. - using simplified mocks for brevity)
        const HomeView = () => `<div class="py-20 text-center"><h1 class="text-6xl font-black mb-6">Nexus <span class="text-indigo-600">Learning.</span></h1><button onclick="router.navigate('courses')" class="btn-grad px-8 py-4 rounded-2xl font-bold">Get Started</button></div>`;
        const CoursesView = () => `<div class="space-y-10"><h2 class="text-3xl font-bold">Academic Catalog</h2><div class="grid grid-cols-3 gap-6">${[1,2,3].map(i => `<div class="card-neo p-8"><h3 class="font-bold text-xl mb-4">Course ${i}</h3><button onclick="router.navigate('checkout')" class="w-full py-3 bg-indigo-50 text-indigo-600 rounded-xl font-bold">Enroll Now</button></div>`).join('')}</div></div>`;
        const BooksView = () => `<div class="text-center p-20 font-bold">Books Module</div>`;
        const TestsView = () => `<div class="text-center p-20 font-bold">Test Series Module</div>`;
        const SolverView = () => `<div class="text-center p-20 font-bold">AI Doubt Solver</div>`;

        window.toggleAuth = () => { authMode = authMode === 'login' ? 'register' : 'login'; router.navigate('auth'); };

        router.navigate('home');
    </script>
</body>
</html>
