<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gaurav Classes | LMS with Admin Panel</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: #1e293b; overflow-x: hidden; }
        h1, h2, h3, .font-heading { font-family: 'Outfit', sans-serif; }
        /* ... existing styles ... */
        .admin-panel { transition: all 0.3s; }
        .upload-form { max-width: 500px; margin: 0 auto; }
        .file-list { max-height: 300px; overflow-y: auto; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 24px; border-radius: 24px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 md:px-6 h-20 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="router.navigate('home')">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-200">
                    <i data-lucide="graduation-cap" class="text-white w-6 h-6"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">Gaurav<span class="text-indigo-600">Classes</span></span>
            </div>

            <div class="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-600">
                <button onclick="router.navigate('courses')" class="hover:text-indigo-600 transition">Courses</button>
                <button onclick="router.navigate('books')" class="hover:text-indigo-600 transition">Books</button>
                <button onclick="router.navigate('tests')" class="hover:text-indigo-600 transition">Test Series</button>
                <button onclick="router.navigate('solver')" class="text-indigo-600 font-bold bg-indigo-50 px-4 py-2 rounded-full">AI Solver</button>
                <button id="admin-link" class="hidden bg-rose-50 text-rose-600 px-4 py-2 rounded-full font-bold hover:bg-rose-100 transition">Admin Panel</button>
            </div>

            <div id="nav-actions" class="flex items-center gap-3"></div>
        </div>
    </nav>

    <main id="app-root" class="max-w-7xl mx-auto px-4 md:px-6 py-6 md:py-12 min-h-screen"></main>

    <script type="module">
        // Initialize Supabase
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- Global State ---
        let currentUser = null;
        let isAdmin = false;
        let currentFilter = 'all';
        let selectedClass = '10';
        let selectedCourseForCheckout = null;
        let selectedCourseId = null;
        let currentSlide = 0;

        // Slides data (same)
        const slides = [
            // ... (unchanged)
        ];

        // Helper: Check if user is logged in
        const isUserLoggedIn = () => currentUser !== null;

        // --- Auth Functions ---
        async function signIn(email, password) {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            return data;
        }

        async function signUp(email, password, name, role = 'student') {
            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) throw error;
            // Create profile
            await supabase.from('profiles').insert([{ id: data.user.id, name, role, class: '10' }]);
            return data;
        }

        async function signOut() {
            await supabase.auth.signOut();
            currentUser = null;
            isAdmin = false;
            router.navigate('home');
        }

        // --- Data Fetching (using Supabase) ---
        async function fetchCourses() {
            const { data, error } = await supabase.from('courses').select('*');
            if (error) throw error;
            return data;
        }

        async function fetchMaterials(classFilter = null) {
            let query = supabase.from('materials').select('*');
            if (classFilter) query = query.eq('class', classFilter);
            const { data, error } = await query;
            if (error) throw error;
            return data;
        }

        async function fetchTestSeries(classFilter = null) {
            let query = supabase.from('test_series').select('*');
            if (classFilter) query = query.eq('class', classFilter);
            const { data, error } = await query;
            if (error) throw error;
            return data;
        }

        async function fetchUserEnrollments(userId) {
            const { data, error } = await supabase.from('enrollments').select('*, courses(*)').eq('user_id', userId);
            if (error) throw error;
            return data;
        }

        // --- Admin Functions ---
        async function uploadMaterial(file, title, type, classValue, courseId = null) {
            // Upload file to storage
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
            const filePath = `materials/${classValue}/${fileName}`;
            const { data: uploadData, error: uploadError } = await supabase.storage
                .from('lms-materials')
                .upload(filePath, file);
            if (uploadError) throw uploadError;

            // Get public URL
            const { data: { publicUrl } } = supabase.storage.from('lms-materials').getPublicUrl(filePath);

            // Save to materials table
            const { error: insertError } = await supabase.from('materials').insert({
                title,
                type,
                class: classValue,
                file_url: publicUrl,
                course_id: courseId || null
            });
            if (insertError) throw insertError;
            return true;
        }

        async function addCourse(courseData) {
            const { error } = await supabase.from('courses').insert([courseData]);
            if (error) throw error;
            return true;
        }

        async function updateCourse(id, updates) {
            const { error } = await supabase.from('courses').update(updates).eq('id', id);
            if (error) throw error;
            return true;
        }

        async function deleteCourse(id) {
            const { error } = await supabase.from('courses').delete().eq('id', id);
            if (error) throw error;
            return true;
        }

        // --- Router (simplified for brevity, but fully functional) ---
        window.router = {
            navigate: async (view, data = null) => {
                if (!isUserLoggedIn() && ['dashboard', 'checkout', 'player'].includes(view)) {
                    view = 'auth';
                }
                if (data) {
                    if (view === 'checkout') selectedCourseForCheckout = data;
                    if (view === 'course-details') selectedCourseId = data;
                    if (view === 'player') selectedCourseId = data;
                }
                const root = document.getElementById('app-root');
                const views = {
                    home: HomeView,
                    courses: CoursesView,
                    books: BooksView,
                    tests: TestsView,
                    solver: SolverView,
                    dashboard: DashboardView,
                    auth: AuthView,
                    checkout: CheckoutView,
                    'course-details': CourseDetailsView,
                    'player': CoursePlayerView,
                    'admin': AdminPanelView
                };
                const viewFn = views[view];
                if (viewFn) {
                    root.innerHTML = await viewFn();
                } else {
                    root.innerHTML = await HomeView();
                }
                updateNavbar();
                lucide.createIcons();
                window.scrollTo(0,0);
            }
        };

        // --- View Functions (only showing essential ones, with Supabase integration) ---
        const HomeView = async () => {
            // (same as before, no data fetch needed)
            return `...`; // Keep original HTML
        };

        const CoursesView = async () => {
            const courses = await fetchCourses();
            const filtered = currentFilter === 'all' ? courses : courses.filter(c => c.category === currentFilter);
            return `
                <div class="space-y-10 animate-fade">
                    <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                        <h2 class="text-3xl font-bold">Explore <span class="text-indigo-600">Courses</span></h2>
                        <div class="toggle-container">
                            ${['all', 'school', 'engineering', 'medical'].map(f => `
                                <div onclick="setFilter('${f}')" class="toggle-item ${currentFilter === f ? 'active' : ''}">${f.toUpperCase()}</div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        ${filtered.map(c => `
                            <div class="card-shadow p-8 rounded-[2rem] flex flex-col h-full">
                                <div class="flex gap-2 mb-4">
                                    ${c.tags?.map(t => `<span class="text-[10px] font-bold uppercase tracking-widest text-slate-400 bg-slate-100 px-2 py-1 rounded">${t}</span>`).join('')}
                                </div>
                                <h3 class="text-xl font-bold mb-2">${c.title}</h3>
                                <p class="text-sm text-slate-500 mb-4">${c.description?.substring(0,80)}...</p>
                                <div class="mt-auto space-y-4">
                                    <div class="flex justify-between items-center">
                                        <span class="text-2xl font-black text-indigo-600">₹${c.price}</span>
                                        <span class="text-xs text-slate-400">${c.duration}</span>
                                    </div>
                                    <div class="flex gap-3">
                                        <button onclick="router.navigate('course-details', ${c.id})" class="flex-1 bg-slate-100 text-slate-800 py-2.5 rounded-xl font-bold hover:bg-slate-200 transition text-sm">View Details</button>
                                        <button onclick="router.navigate('checkout', ${JSON.stringify(c).replace(/"/g, '&quot;')})" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl font-bold hover:bg-indigo-500 transition shadow-sm text-sm">Enroll</button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        };

        const BooksView = async () => {
            const materials = await fetchMaterials(selectedClass);
            return `
                <div class="space-y-10 animate-fade">
                    <div class="space-y-6">
                        <div class="flex justify-between items-end flex-wrap gap-4">
                            <h2 class="text-3xl font-bold font-heading">Nexus <span class="text-indigo-600">Library</span></h2>
                            <span class="text-[10px] font-bold text-slate-400 bg-slate-100 px-3 py-1 rounded-full">Selected: ${selectedClass}</span>
                        </div>
                        ${ClassPillToggle('books')}
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
                        ${materials.map(m => `
                            <div class="group cursor-pointer" onclick="downloadFile('${m.file_url}', '${m.title}')">
                                <div class="aspect-[3/4] bg-white rounded-[2rem] mb-4 flex flex-col items-center justify-center border-2 border-slate-100 group-hover:border-indigo-600 transition-all shadow-sm overflow-hidden relative">
                                    <div class="absolute top-4 right-4 w-8 h-8 bg-slate-50 rounded-full flex items-center justify-center text-slate-400 group-hover:bg-indigo-600 group-hover:text-white transition">
                                        <i data-lucide="download" class="w-4 h-4"></i>
                                    </div>
                                    <i data-lucide="${m.type === 'video' ? 'video' : (m.type === 'ppt' ? 'presentation' : 'book-open')}" class="text-slate-200 w-16 h-16 mb-4 group-hover:text-indigo-100 transition"></i>
                                    <div class="text-center px-4">
                                        <p class="text-[10px] font-black uppercase text-indigo-500 tracking-tighter mb-1">${m.type?.toUpperCase()}</p>
                                        <h4 class="font-bold text-slate-800 leading-tight text-sm">${m.title}</h4>
                                    </div>
                                    <div class="absolute bottom-0 left-0 w-full h-1 bg-slate-100 group-hover:bg-indigo-600 transition"></div>
                                </div>
                            </div>
                        `).join('')}
                        ${materials.length === 0 ? '<div class="col-span-full text-center text-slate-500">No materials available for this class yet.</div>' : ''}
                    </div>
                    ${isAdmin ? `
                        <div class="mt-8 text-center">
                            <button onclick="showUploadModal()" class="bg-indigo-600 text-white px-6 py-3 rounded-2xl text-sm font-bold">+ Upload Material</button>
                        </div>
                    ` : ''}
                </div>
            `;
        };

        const DashboardView = async () => {
            const user = currentUser;
            const profile = (await supabase.from('profiles').select('*').eq('id', user.id).single()).data;
            const enrollments = await fetchUserEnrollments(user.id);
            // ... rest of dashboard (similar to earlier)
            return `...`; // (similar to previous dashboard, but dynamic)
        };

        // Admin Panel View
        const AdminPanelView = () => {
            if (!isAdmin) return '<div class="text-center py-20">Access denied.</div>';
            return `
                <div class="space-y-10 animate-fade">
                    <div class="bg-white rounded-2xl shadow p-6">
                        <h2 class="text-2xl font-bold mb-4">Admin Dashboard</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <!-- Upload Material -->
                            <div class="border rounded-xl p-4">
                                <h3 class="text-lg font-bold mb-3">Upload Material</h3>
                                <div id="uploadForm">
                                    <select id="materialType" class="w-full p-2 border rounded mb-2">
                                        <option value="ebook">E-Book (PDF)</option>
                                        <option value="ppt">PPT</option>
                                        <option value="video">Video</option>
                                    </select>
                                    <input type="text" id="materialTitle" placeholder="Title" class="w-full p-2 border rounded mb-2">
                                    <select id="materialClass" class="w-full p-2 border rounded mb-2">
                                        ${['6','7','8','9','10','11','12','JEE','NEET'].map(c => `<option value="${c}">Class ${c}</option>`).join('')}
                                    </select>
                                    <input type="file" id="materialFile" class="w-full p-2 border rounded mb-2">
                                    <button onclick="uploadMaterialFile()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl">Upload</button>
                                </div>
                                <div id="uploadProgress" class="hidden mt-2 text-sm text-slate-600"></div>
                            </div>
                            <!-- Add Course -->
                            <div class="border rounded-xl p-4">
                                <h3 class="text-lg font-bold mb-3">Add Course</h3>
                                <div id="courseForm">
                                    <input type="text" id="courseTitle" placeholder="Title" class="w-full p-2 border rounded mb-2">
                                    <select id="courseCategory" class="w-full p-2 border rounded mb-2">
                                        <option value="school">School</option>
                                        <option value="engineering">Engineering</option>
                                        <option value="medical">Medical</option>
                                    </select>
                                    <input type="text" id="coursePrice" placeholder="Price" class="w-full p-2 border rounded mb-2">
                                    <input type="text" id="courseDuration" placeholder="Duration (e.g., 6 months)" class="w-full p-2 border rounded mb-2">
                                    <textarea id="courseDesc" placeholder="Description" class="w-full p-2 border rounded mb-2" rows="2"></textarea>
                                    <input type="text" id="courseTags" placeholder="Tags (comma separated)" class="w-full p-2 border rounded mb-2">
                                    <button onclick="addNewCourse()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl">Add Course</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Manage Materials -->
                    <div class="bg-white rounded-2xl shadow p-6">
                        <h3 class="text-xl font-bold mb-4">Manage Materials</h3>
                        <div id="materialsList" class="grid grid-cols-1 gap-2"></div>
                        <button onclick="loadMaterials()" class="mt-4 text-indigo-600 underline">Refresh</button>
                    </div>
                </div>
            `;
        };

        // --- Helper Functions for Admin Panel ---
        window.showUploadModal = () => {
            // For simplicity, we'll use the Admin Panel's upload form already visible
            // You can also implement a modal if needed
        };

        window.uploadMaterialFile = async () => {
            const fileInput = document.getElementById('materialFile');
            const title = document.getElementById('materialTitle').value;
            const type = document.getElementById('materialType').value;
            const classVal = document.getElementById('materialClass').value;
            if (!fileInput.files[0] || !title) {
                alert('Please fill all fields');
                return;
            }
            const progressDiv = document.getElementById('uploadProgress');
            progressDiv.classList.remove('hidden');
            progressDiv.innerHTML = 'Uploading...';
            try {
                await uploadMaterial(fileInput.files[0], title, type, classVal);
                progressDiv.innerHTML = 'Upload successful!';
                setTimeout(() => progressDiv.classList.add('hidden'), 3000);
                fileInput.value = '';
                document.getElementById('materialTitle').value = '';
                // Refresh materials list in admin panel
                if (document.getElementById('materialsList')) loadMaterials();
                // Also refresh books view if open
                if (window.location.hash === '#books') router.navigate('books');
            } catch (error) {
                progressDiv.innerHTML = 'Error: ' + error.message;
                console.error(error);
            }
        };

        window.addNewCourse = async () => {
            const title = document.getElementById('courseTitle').value;
            const category = document.getElementById('courseCategory').value;
            const price = parseInt(document.getElementById('coursePrice').value);
            const duration = document.getElementById('courseDuration').value;
            const description = document.getElementById('courseDesc').value;
            const tagsStr = document.getElementById('courseTags').value;
            const tags = tagsStr.split(',').map(t => t.trim());
            if (!title || !price) {
                alert('Please fill required fields');
                return;
            }
            try {
                await addCourse({ title, category, price, duration, description, tags });
                alert('Course added!');
                // Clear form
                document.getElementById('courseTitle').value = '';
                document.getElementById('coursePrice').value = '';
                document.getElementById('courseDuration').value = '';
                document.getElementById('courseDesc').value = '';
                document.getElementById('courseTags').value = '';
            } catch (error) {
                alert('Error: ' + error.message);
            }
        };

        window.loadMaterials = async () => {
            const materials = await fetchMaterials();
            const container = document.getElementById('materialsList');
            if (!container) return;
            container.innerHTML = materials.map(m => `
                <div class="flex justify-between items-center border-b py-2">
                    <div><strong>${m.title}</strong> (${m.type}, ${m.class})</div>
                    <div><button onclick="deleteMaterial(${m.id})" class="text-red-600 text-sm">Delete</button></div>
                </div>
            `).join('');
        };

        // --- Auth UI ---
        const AuthView = () => `
            <div class="max-w-md mx-auto py-12 animate-fade">
                <div class="bg-white p-10 rounded-[2.5rem] border border-slate-200 shadow-xl space-y-8">
                    <div class="text-center space-y-2"><h2 class="text-3xl font-extrabold text-slate-900">${authMode === 'login' ? 'Welcome Back' : 'Create Account'}</h2><p class="text-slate-500 text-sm">Join Gaurav Classes Premium</p></div>
                    <div class="space-y-4">
                        ${authMode === 'register' ? '<input type="text" id="regName" placeholder="Full Name" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-indigo-600 transition">' : ''}
                        <input type="email" id="authEmail" placeholder="Email Address" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-indigo-600 transition">
                        <input type="password" id="authPassword" placeholder="Password" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-indigo-600 transition">
                        <button onclick="handleAuth()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold text-lg hover:bg-indigo-700 transition">${authMode === 'login' ? 'Sign In' : 'Register Now'}</button>
                    </div>
                    <p class="text-center text-sm font-semibold text-slate-600">${authMode === 'login' ? "New student?" : "Already have an account?"}<button onclick="toggleAuthMode()" class="text-indigo-600 font-bold hover:underline ml-1">${authMode === 'login' ? 'Register' : 'Login'}</button></p>
                </div>
            </div>
        `;

        window.handleAuth = async () => {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            try {
                if (authMode === 'login') {
                    const data = await signIn(email, password);
                    // Fetch profile to determine role
                    const { data: profile } = await supabase.from('profiles').select('role').eq('id', data.user.id).single();
                    isAdmin = profile?.role === 'admin';
                    currentUser = data.user;
                    router.navigate('dashboard');
                } else {
                    const name = document.getElementById('regName').value;
                    if (!name) throw new Error('Please enter your name');
                    await signUp(email, password, name);
                    // After signup, automatically login
                    const data = await signIn(email, password);
                    currentUser = data.user;
                    isAdmin = false;
                    router.navigate('dashboard');
                }
            } catch (error) {
                alert(error.message);
            }
        };

        // --- Helper Functions for UI ---
        const updateNavbar = () => {
            const navActions = document.getElementById('nav-actions');
            const adminLink = document.getElementById('admin-link');
            if (!navActions) return;
            if (isUserLoggedIn()) {
                navActions.innerHTML = `
                    <div class="flex items-center gap-4">
                        <button onclick="router.navigate('dashboard')" class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600"><i data-lucide="layout-dashboard" class="w-5 h-5"></i></button>
                        <button onclick="signOut()" class="px-5 py-2.5 bg-rose-50 text-rose-600 rounded-xl text-sm font-bold flex items-center gap-2"><i data-lucide="log-out" class="w-4 h-4"></i> Logout</button>
                    </div>
                `;
                if (adminLink && isAdmin) adminLink.classList.remove('hidden');
                else if (adminLink) adminLink.classList.add('hidden');
            } else {
                navActions.innerHTML = `<button onclick="router.navigate('auth')" class="btn-primary px-6 py-2.5 rounded-xl text-sm font-bold">Login</button>`;
                if (adminLink) adminLink.classList.add('hidden');
            }
            lucide.createIcons();
        };

        // --- Initialize Auth Listener ---
        supabase.auth.onAuthStateChange(async (event, session) => {
            currentUser = session?.user || null;
            if (currentUser) {
                const { data: profile } = await supabase.from('profiles').select('role').eq('id', currentUser.id).single();
                isAdmin = profile?.role === 'admin';
            } else {
                isAdmin = false;
            }
            updateNavbar();
            // If on admin page and not admin, redirect
            if (window.location.hash === '#admin' && !isAdmin) router.navigate('home');
        });

        // --- Start the app ---
        router.navigate('home');
    </script>
</body>
</html>
