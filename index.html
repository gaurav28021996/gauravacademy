<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav Classes | Nexus Books & Store</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg-primary: #050810;
            --bg-secondary: #0f172a;
            --accent-cyan: #22d3ee;
            --accent-indigo: #6366f1;
            --glass: rgba(15, 23, 42, 0.75);
            --border: rgba(255, 255, 255, 0.1);
        }

        body { font-family: 'Syne', sans-serif; background: var(--bg-primary); color: #f8fafc; overflow-x: hidden; }
        h1, h2, h3, .font-heading { font-family: 'Orbitron', sans-serif; }

        .mesh-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(34, 211, 238, 0.12) 0px, transparent 50%);
        }

        .glass-card {
            background: var(--glass); backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover { border-color: var(--accent-indigo); transform: translateY(-4px); }

        .cart-badge {
            position: absolute; top: -5px; right: -5px;
            background: var(--accent-cyan); color: black;
            font-size: 10px; font-weight: 900; width: 18px; height: 18px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
        }

        input, select, textarea {
            background: rgba(255,255,255,0.05) !important;
            border: 1px solid var(--border) !important;
            color: white !important;
            border-radius: 12px !important;
            padding: 12px 16px !important;
            outline: none;
        }

        input:focus { border-color: var(--accent-cyan) !important; }

        .shimmer-btn {
            background: linear-gradient(90deg, #6366f1, #22d3ee, #6366f1);
            background-size: 200%;
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer { 0% { background-position: 0%; } 100% { background-position: 200%; } }
    </style>
</head>
<body>
    <div class="mesh-bg"></div>

    <header class="sticky top-0 z-[100] px-6 py-4 glass-card mx-4 mt-4 rounded-2xl flex justify-between items-center">
        <div class="flex items-center gap-3 cursor-pointer" onclick="router.navigate('home')">
            <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center">
                <i data-lucide="book-open" class="text-white w-6 h-6"></i>
            </div>
            <span class="font-heading font-black tracking-tighter text-lg uppercase">Nexus <span class="text-cyan-400">Store</span></span>
        </div>

        <nav id="main-nav" class="hidden lg:flex gap-8 items-center text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">
            <button onclick="router.navigate('home')" class="hover:text-white transition">Home</button>
            <button onclick="router.navigate('courses')" class="hover:text-white transition">Courses</button>
            <button onclick="router.navigate('books')" class="hover:text-white transition">Books</button>
            <button onclick="router.navigate('dashboard')" class="hover:text-white transition">My Library</button>
        </nav>

        <div class="flex items-center gap-6">
            <button onclick="router.navigate('checkout')" class="relative p-2 text-slate-400 hover:text-cyan-400 transition">
                <i data-lucide="shopping-cart" class="w-6 h-6"></i>
                <div id="cart-count" class="cart-badge">0</div>
            </button>
            <div id="user-zone"></div>
        </div>
    </header>

    <main id="app-root" class="max-w-7xl mx-auto px-6 py-12 min-h-screen">
        </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ── CONFIGURATION (Replace with your actual Firebase Keys) ──
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "gaurav-classes.firebaseapp.com",
            projectId: "gaurav-classes",
            storageBucket: "gaurav-classes.firebasestorage.app",
            messagingSenderId: "...",
            appId: "..."
        };

        const ADMIN_UID = "YOUR_ADMIN_UID";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let cart = [];
        let items = []; // Holds both courses and books

        // ── STATE & ROUTER ──
        const state = { currentView: 'home' };

        window.router = {
            navigate: (view) => {
                state.currentView = view;
                render();
                window.scrollTo(0, 0);
            }
        };

        // ── VIEWS ──

        const HomeView = () => `
            <section class="text-center space-y-12 py-20">
                <h1 class="text-6xl md:text-8xl font-black uppercase tracking-tighter leading-none">Nexus <br> <span class="text-indigo-500">Academic Hub</span></h1>
                <p class="text-slate-500 max-w-xl mx-auto text-lg">Official store for Gaurav Classes. Get the best study modules and hard-copy books delivered to your doorstep.</p>
                <div class="flex justify-center gap-4">
                    <button onclick="router.navigate('books')" class="shimmer-btn px-10 py-4 rounded-xl font-black uppercase text-xs tracking-widest shadow-2xl">Browse Books</button>
                    <button onclick="router.navigate('courses')" class="glass-card px-10 py-4 rounded-xl font-black uppercase text-xs tracking-widest">Buy Courses</button>
                </div>
            </section>
        `;

        const BooksView = () => {
            const books = items.filter(i => i.type === 'Book');
            return `
                <div class="space-y-12">
                    <div class="flex flex-col md:flex-row justify-between items-end gap-6">
                        <h2 class="text-4xl font-black uppercase tracking-tighter">Reference <span class="text-cyan-400">Library</span></h2>
                        <span class="text-[10px] font-black uppercase tracking-widest text-slate-500">Showing ${books.length} Premium Publications</span>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                        ${books.map(book => `
                            <div class="glass-card p-6 rounded-[2rem] flex flex-col group">
                                <div class="relative w-full aspect-[3/4] rounded-2xl mb-6 overflow-hidden shadow-2xl">
                                    <img src="${book.image || 'https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=400'}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent flex flex-col justify-end p-6 opacity-0 group-hover:opacity-100 transition">
                                        <p class="text-[10px] text-cyan-400 font-black uppercase mb-1">Author: ${book.author || 'Gaurav Sir'}</p>
                                    </div>
                                </div>
                                <h3 class="text-lg font-bold mb-2 line-clamp-1">${book.title}</h3>
                                <div class="flex justify-between items-center mb-6">
                                    <span class="text-[10px] font-black uppercase text-slate-500">${book.category}</span>
                                    <span class="text-xl font-black text-cyan-400">₹${book.price}</span>
                                </div>
                                <button onclick="addToCart('${book.id}')" class="w-full py-3 bg-white/5 border border-white/10 rounded-xl font-black uppercase text-[10px] tracking-widest hover:bg-indigo-600 transition">Add To Cart</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        };

        const CheckoutView = () => {
            const total = cart.reduce((acc, item) => acc + parseInt(item.price), 0);
            return `
                <div class="grid lg:grid-cols-3 gap-12">
                    <div class="lg:col-span-2 space-y-8">
                        <h2 class="text-3xl font-black uppercase tracking-tighter">Secure <span class="text-cyan-400">Checkout</span></h2>
                        
                        <div class="glass-card p-8 rounded-[2rem] space-y-6">
                            <h3 class="text-xs font-black uppercase tracking-widest text-slate-500">Shipping Information</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <input type="text" placeholder="Full Name" class="w-full">
                                <input type="text" placeholder="Phone Number" class="w-full">
                                <input type="text" placeholder="City" class="w-full">
                                <input type="text" placeholder="PIN Code" class="w-full">
                                <textarea placeholder="Full Delivery Address" class="w-full md:col-span-2 h-32"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="glass-card p-8 rounded-[2rem] space-y-6">
                            <h3 class="text-xs font-black uppercase tracking-widest text-slate-500">Order Summary</h3>
                            <div id="checkout-items" class="space-y-4 max-h-60 overflow-y-auto pr-2">
                                ${cart.length === 0 ? '<p class="text-xs text-slate-500 italic">Your cart is empty.</p>' : cart.map((item, idx) => `
                                    <div class="flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/5">
                                        <div class="text-[10px] font-bold uppercase">${item.title}</div>
                                        <div class="flex items-center gap-3">
                                            <span class="text-[10px] font-black">₹${item.price}</span>
                                            <button onclick="removeFromCart(${idx})" class="text-rose-500"><i data-lucide="x-circle" class="w-4 h-4"></i></button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="border-t border-white/10 pt-4 flex justify-between items-center">
                                <span class="text-xs font-black uppercase">Grand Total</span>
                                <span class="text-2xl font-black text-cyan-400">₹${total}</span>
                            </div>
                            <button onclick="processOrder()" ${cart.length === 0 ? 'disabled' : ''} class="w-full py-4 shimmer-btn rounded-xl font-black uppercase text-xs tracking-widest shadow-xl ${cart.length === 0 ? 'opacity-50' : ''}">Complete Payment</button>
                        </div>
                    </div>
                </div>
            `;
        };

        // ── CORE LOGIC ──

        window.render = () => {
            const root = document.getElementById('app-root');
            const userZone = document.getElementById('user-zone');
            
            userZone.innerHTML = currentUser 
                ? `<div class="flex items-center gap-4">
                    <div class="hidden md:block text-right">
                        <p class="text-[10px] font-black uppercase text-white">${currentUser.email.split('@')[0]}</p>
                        <button onclick="handleLogout()" class="text-[8px] font-bold text-rose-500 uppercase tracking-widest">Logout</button>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-black text-xs">${currentUser.email.charAt(0).toUpperCase()}</div>
                   </div>`
                : `<button onclick="router.navigate('auth')" class="px-6 py-2 bg-indigo-600 rounded-full text-[10px] font-black uppercase tracking-widest">Login</button>`;

            document.getElementById('cart-count').innerText = cart.length;

            if (state.currentView === 'home') root.innerHTML = HomeView();
            if (state.currentView === 'books') root.innerHTML = BooksView();
            if (state.currentView === 'checkout') root.innerHTML = CheckoutView();
            // (Include your existing CoursesView and AdminView here)

            lucide.createIcons();
        };

        window.addToCart = (id) => {
            const item = items.find(i => i.id === id);
            cart.push(item);
            render();
            // Subtle toast or feedback could be added here
        };

        window.removeFromCart = (index) => {
            cart.splice(index, 1);
            render();
        };

        window.processOrder = () => {
            alert("Redirecting to Razorpay/Secure Payment Gateway... (Nexus 2.0 Integration Live)");
            // Here you would typically push an 'order' object to Firestore
        };

        window.handleLogout = () => signOut(auth).then(() => location.reload());

        // ── FIREBASE LISTENERS ──

        onAuthStateChanged(auth, user => {
            currentUser = user;
            render();
        });

        // Real-time Sync for Items (Books + Courses)
        onSnapshot(query(collection(db, "products"), orderBy("createdAt", "desc")), (snap) => {
            items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            render();
        });

        // Initialize Icons
        window.onload = () => {
            render();
            lucide.createIcons();
        };
    </script>
</body>
</html>
