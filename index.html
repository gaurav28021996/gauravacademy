        h1, h2, h3, .font-heading { font-family: 'Outfit', sans-serif; }

        .toggle-container { display: inline-flex; background: #f1f5f9; padding: 4px; border-radius: 16px; border: 1px solid #e2e8f0; }

        .class-pill-grid { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .class-pill-grid::-webkit-scrollbar { display: none; }
        .class-pill { white-space: nowrap; padding: 6px 16px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; border: 2px solid #f1f5f9; background: white; color: #94a3b8; transition: 0.2s; cursor: pointer; }

        .card-shadow { background: white; border: 1px solid #e2e8f0; transition: all 0.3s ease; }
        .card-shadow:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }

        .btn-primary { background: var(--primary); color: white; transition: 0.2s; }
        .btn-primary:hover { transform: scale(1.02); filter: brightness(1.1); }
        .animate-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }

        // --- Helper Functions ---
        const toBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        const initMentorAI = () => {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            const solveBtn = document.getElementById('solve-btn');
            const outputArea = document.getElementById('solution-output');
            const outputText = document.getElementById('solution-text');
            const preview = document.getElementById('image-preview');
            const previewCont = document.getElementById('preview-container');
            const uploadPrompt = document.getElementById('upload-prompt');

            if (!dropZone) return;

            dropZone.onclick = () => fileInput.click();
            fileInput.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        preview.src = event.target.result;
                        previewCont.classList.remove('hidden');
                        uploadPrompt.classList.add('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            };

            solveBtn.onclick = async () => {
                if (!fileInput.files[0]) {
                    alert("Please upload an image first!");
                    return;
                }

                // Replace with your Gemini API key
                const GEMINI_API_KEY = "AIzaSyAbNpAPUGV5NiMRqBGfxxVBwBNApKQ4eCw"; // <-- Replace with your actual key
                solveBtn.disabled = true;
                solveBtn.innerHTML = '<span class="flex items-center justify-center gap-2"><i data-lucide="loader-2" class="animate-spin w-5 h-5"></i> Thinking...</span>';
                lucide.createIcons();

                try {
                    const base64Data = await toBase64(fileInput.files[0]);
                    const mimeType = fileInput.files[0].type;

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: "You are an expert Math and Science tutor. Identify the educational problem in this image. Provide a detailed, step-by-step solution with clear explanations suitable for a Class 10-12 student. Use markdown formatting (headings, bullet points, math expressions) for clarity." },
                                    { inline_data: { mime_type: mimeType, data: base64Data } }
                                ]
                            }]
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || "API request failed");
                    }

                    const data = await response.json();
                    const resultText = data.candidates[0].content.parts[0].text;

                    outputArea.classList.remove('hidden');
                    if (typeof marked !== 'undefined') {
                        outputText.innerHTML = marked.parse(resultText);
                    } else {
                        outputText.innerText = resultText;
                    }
                    outputArea.scrollIntoView({ behavior: 'smooth' });
                } catch (error) {
                    console.error("API Error:", error);
                    alert("Mentor AI is currently busy: " + error.message);
                } finally {
                    solveBtn.disabled = false;
                    solveBtn.innerHTML = "Get Step-by-Step Solution";
                    lucide.createIcons();
                }
            };
        };

};

    // but for this HTML structure, we can use a prompt for quick data entry:

    const price = prompt("Enter Price (INR):");

    let dbCourses = JSON.parse(localStorage.getItem('courses'));

    };

    const email = document.getElementById('authEmail').value;
    const pass = document.getElementById('authPassword').value;

    if (email === ADMIN_CREDENTIALS.email && pass === ADMIN_CREDENTIALS.pass) {
        localStorage.setItem('isLoggedIn', 'true');

        router.navigate('admin'); // Navigate to Admin Panel
