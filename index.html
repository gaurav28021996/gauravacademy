<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav Classes | Premium Learning Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #2563eb; --accent: #7c3aed; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; background-color: #f8fafc; }
        .glass-header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.3); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4); }
        .study-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(0,0,0,0.05); }
        .study-card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-tab { background: linear-gradient(135deg, #2563eb, #7c3aed) !important; color: white !important; border-color: transparent !important; transform: scale(1.05); box-shadow: 0 15px 30px -10px rgba(37, 99, 235, 0.5); }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .search-expand { transition: width 0.4s ease; width: 240px; }
        .search-expand:focus { width: 350px; }
    </style>
</head>
<body>

<header class="sticky top-0 z-[100] glass-header px-4 md:px-8 py-3">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="flex items-center space-x-3 cursor-pointer group" onclick="showView('home')">
            <div class="w-11 h-11 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-lg group-hover:rotate-6 transition-transform">
                <i class="fas fa-graduation-cap text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-extrabold tracking-tight leading-none">Gaurav Classes</h1>
                <span class="text-[10px] font-bold text-blue-600 uppercase tracking-tighter">Digital Campus</span>
            </div>
        </div>

        <div class="hidden lg:flex items-center relative">
            <i class="fas fa-search absolute left-4 text-slate-400"></i>
            <input type="text" onkeyup="globalSearch()" id="main-search" placeholder="Search resources..." class="search-expand pl-12 pr-4 py-2.5 bg-slate-100/50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-500/20 text-sm font-medium">
        </div>

        <div class="flex items-center space-x-2 md:space-x-6">
            <nav class="hidden md:flex items-center space-x-1">
                <button onclick="showView('home')" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 transition">Home</button>
                <button onclick="openLibrary('book')" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 transition">Books</button>
                <button onclick="openLibrary('pyq')" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 transition">PYQs</button>
                <button onclick="openLibrary('test')" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100 transition">Tests</button>
            </nav>
            <div class="flex items-center space-x-3">
                <button class="relative p-2.5 rounded-xl hover:bg-slate-100 transition">
                    <i class="fa-solid fa-cart-shopping text-slate-700"></i>
                    <span id="cart-count" class="absolute top-1 right-1 bg-blue-600 text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center border-2 border-white">0</span>
                </button>
                <button class="btn-primary text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg">Login</button>
            </div>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-12">
    <section id="view-home" class="fade-in">
        <div class="grid lg:grid-cols-2 gap-12 items-center py-10">
            <div>
                <div class="inline-flex items-center space-x-2 bg-blue-50 border border-blue-100 px-3 py-1 rounded-full mb-6">
                    <span class="flex h-2 w-2 rounded-full bg-blue-600 animate-pulse"></span>
                    <span class="text-xs font-bold text-blue-700 uppercase">Enrollment Open 2026</span>
                </div>
                <h2 class="text-5xl md:text-7xl font-extrabold text-slate-900 leading-[1.1] mb-6">
                    Unlock Your <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">Academic Potential.</span>
                </h2>
                <p class="text-slate-500 text-lg mb-10 leading-relaxed max-w-lg">
                    Premium study materials, NCERT textbooks, and competitive exam prep for Classes 6-12, JEE, and NEET.
                </p>
                <button onclick="openLibrary('book')" class="btn-primary text-white px-10 py-4 rounded-2xl font-bold flex items-center space-x-3">
                    <span>Explore Library</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </div>
            <div class="hidden lg:block relative">
                <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80&w=800" class="rounded-[3rem] shadow-2xl rotate-2" alt="Learning">
            </div>
        </div>
    </section>

    <section id="view-library" class="fade-in hidden">
        <div class="mb-10 text-center md:text-left">
            <h2 id="library-title" class="text-4xl font-extrabold text-slate-900 mb-2">Digital Library</h2>
            <p id="library-desc" class="text-slate-500">Select your class to see available resources.</p>
        </div>

        <div class="relative mb-12">
            <div class="flex overflow-x-auto space-x-3 pb-6 no-scrollbar snap-x scroll-smooth px-2" id="class-carousel">
                <button onclick="filterByClass('6')" class="class-tab snap-start px-8 py-4 rounded-3xl bg-white border border-slate-200 font-bold text-sm whitespace-nowrap shadow-sm" data-class="6">Class 6</button>
                <button onclick="filterByClass('7')" class="class-tab snap-start px-8 py-4 rounded-3xl bg-white border border-slate-200 font-bold text-sm whitespace-nowrap shadow-sm" data-class="7">Class 7</button>
                <button onclick="filterByClass('8')" class="class-tab snap-start px-8 py-4 rounded-3xl bg-white border border-slate-200 font-bold text-sm whitespace-nowrap shadow-sm" data-class="8">Class 8</button>
                <button onclick="filterByClass('9')" class="class-tab snap-start px-8 py-4 rounded-3xl bg-white border border-slate-200 font-bold text-sm whitespace-nowrap shadow-sm" data-class="9">Class 9</button>
                <button onclick="filterByClass('10')" class="class-tab snap-start px-8 py-4 rounded-3xl bg-white border border-slate-200 font-bold text-sm whitespace-nowrap shadow-sm" data-class="10">Class 10</button>
                <button onclick="filterByClass('11')" class="class-tab snap-start px-8 py-4 rounded-3xl bg-white border border-slate-200 font-bold text-sm whitespace-nowrap shadow-sm" data-class="11">Class 11</button>
                <button onclick="filterByClass('12')" class="class-tab snap-start px-8 py-4 rounded-3xl bg-white border border-slate-200 font-bold text-sm whitespace-nowrap shadow-sm active-tab" data-class="12">Class 12</button>
                <div class="flex-none w-[2px] bg-slate-200 mx-4 h-10 self-center"></div>
                <button onclick="filterByClass('poly')" class="class-tab snap-start px-8 py-4 rounded-3xl bg-indigo-50 text-indigo-600 border border-indigo-100 font-black text-sm whitespace-nowrap" data-class="poly">Polytechnic</button>
                <button onclick="filterByClass('jee')" class="class-tab snap-start px-8 py-4 rounded-3xl bg-blue-50 text-blue-600 border border-blue-100 font-black text-sm whitespace-nowrap" data-class="jee">JEE MAINS</button>
                <button onclick="filterByClass('neet')" class="class-tab snap-start px-8 py-4 rounded-3xl bg-emerald-50 text-emerald-600 border border-emerald-100 font-black text-sm whitespace-nowrap" data-class="neet">NEET 2026</button>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8" id="universal-grid">
            </div>
    </section>
</main>

<script>
    const libraryData = [
        { id: 1, type: 'book', class: '12', name: 'Physics NCERT Part I', price: 0, tag: 'NCERT', img: 'https://via.placeholder.com/300x400?text=Physics+12' },
        { id: 2, type: 'book', class: '12', name: 'Chemistry NCERT Part I', price: 0, tag: 'NCERT', img: 'https://via.placeholder.com/300x400?text=Chemistry+12' },
        { id: 3, type: 'book', class: '12', name: 'Modern ABC Physics', price: 650, tag: 'Ref', img: 'https://via.placeholder.com/300x400?text=Modern+ABC' },
        { id: 4, type: 'pyq', class: '12', name: 'CBSE Physics 2025 Paper', price: 0, tag: 'Solved', img: 'https://via.placeholder.com/300x400?text=PYQ+12' },
        { id: 5, type: 'test', class: '12', name: 'Electrostatics Mock', price: 0, tag: 'Live', img: 'https://via.placeholder.com/300x400?text=Test+12' },
        { id: 6, type: 'book', class: '10', name: 'Maths Standard', price: 0, tag: 'NCERT', img: 'https://via.placeholder.com/300x400?text=Maths+10' },
        { id: 7, type: 'pyq', class: '10', name: 'UP Board Science 2024', price: 0, tag: 'Solved', img: 'https://via.placeholder.com/300x400?text=UP+Board' },
        { id: 8, type: 'book', class: 'jee', name: 'HC Verma Physics', price: 450, tag: 'Ref', img: 'https://via.placeholder.com/300x400?text=HC+Verma' }
    ];

    let currentViewType = 'book';
    let currentSelectedClass = '12';
    let cartCount = 0;

    function showView(viewId) {
        document.querySelectorAll('main section').forEach(s => s.classList.add('hidden'));
        document.getElementById('view-' + viewId).classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openLibrary(type) {
        currentViewType = type;
        const titles = {
            'book': { t: 'Digital Library', d: 'Explore NCERT and Reference textbooks.' },
            'pyq': { t: 'Previous Year Papers', d: 'Master the exam pattern with solved papers.' },
            'test': { t: 'Chapter-wise Tests', d: 'Real-time mock tests with instant results.' }
        };
        document.getElementById('library-title').innerText = titles[type].t;
        document.getElementById('library-desc').innerText = titles[type].d;
        showView('library');
        renderLibrary();
    }

    function renderLibrary() {
        const grid = document.getElementById('universal-grid');
        grid.innerHTML = '';
        const filtered = libraryData.filter(item => item.type === currentViewType && item.class === currentSelectedClass);

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="col-span-full py-20 text-center text-slate-400 font-bold">No resources found for Class ${currentSelectedClass} in this category.</div>`;
            return;
        }

        filtered.forEach(item => {
            const isTest = item.type === 'test';
            grid.innerHTML += `
                <div class="study-card bg-white p-5 rounded-[2.5rem] fade-in searchable" data-name="${item.name}">
                    <div class="relative overflow-hidden rounded-[1.5rem] mb-4 group">
                        <img src="${item.img}" class="w-full h-56 object-cover transition-transform group-hover:scale-110">
                        <div class="absolute top-3 left-3 bg-white/90 backdrop-blur px-3 py-1 rounded-lg text-[10px] font-black uppercase text-blue-600">${item.tag}</div>
                    </div>
                    <h4 class="font-bold text-slate-800 truncate px-1">${item.name}</h4>
                    <div class="flex justify-between items-center mt-5 pt-4 border-t border-slate-50">
                        <div>
                            <span class="block text-[10px] text-slate-400 font-bold uppercase tracking-widest">Price</span>
                            <span class="font-black text-blue-600">${item.price === 0 ? 'FREE' : '₹' + item.price}</span>
                        </div>
                        <button onclick="handleAction(${item.id})" class="flex items-center space-x-2 bg-slate-900 text-white px-4 py-2.5 rounded-2xl hover:bg-blue-600 transition shadow-lg">
                            <i class="fas ${isTest ? 'fa-play' : (item.price === 0 ? 'fa-download' : 'fa-cart-plus')} text-xs"></i>
                            <span class="text-xs font-bold">${isTest ? 'Start' : (item.price === 0 ? 'Get' : 'Add')}</span>
                        </button>
                    </div>
                </div>`;
        });
    }

    function filterByClass(classId) {
        currentSelectedClass = classId;
        document.querySelectorAll('.class-tab').forEach(tab => tab.classList.remove('active-tab'));
        const btn = document.querySelector(`[data-class="${classId}"]`);
        if(btn) btn.classList.add('active-tab');
        renderLibrary();
    }

    function handleAction(id) {
        const item = libraryData.find(i => i.id === id);
        if(item.type === 'test') {
            alert("Starting " + item.name + ". Good luck!");
        } else {
            cartCount++;
            document.getElementById('cart-count').innerText = cartCount;
            alert(item.name + " added to bag!");
        }
    }

    function globalSearch() {
        const query = document.getElementById('main-search').value.toLowerCase();
        document.querySelectorAll('.searchable').forEach(card => {
            const name = card.getAttribute('data-name').toLowerCase();
            card.style.display = name.includes(query) ? 'block' : 'none';
        });
    }

    window.onload = () => { renderLibrary(); };
</script>

</body>
</html>
