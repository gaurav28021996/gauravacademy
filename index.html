<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Gaurav Classes | LMS with Admin Panel</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: #1e293b; overflow-x: hidden; }
        h1, h2, h3, .font-heading { font-family: 'Outfit', sans-serif; }

        .toggle-container { display: inline-flex; background: #f1f5f9; padding: 4px; border-radius: 16px; border: 1px solid #e2e8f0; flex-wrap: wrap; justify-content: center; }
        .toggle-item { padding: 8px 20px; border-radius: 12px; font-size: 0.875rem; font-weight: 600; transition: all 0.2s; cursor: pointer; color: #64748b; }
        .toggle-item.active { background: white; color: var(--primary); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1); }

        .class-pill-grid { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .class-pill-grid::-webkit-scrollbar { display: none; }
        .class-pill { white-space: nowrap; padding: 6px 16px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; border: 2px solid #f1f5f9; background: white; color: #94a3b8; transition: 0.2s; cursor: pointer; }
        .class-pill.active { border-color: var(--primary); color: var(--primary); background: #eff6ff; }

        .card-shadow { background: white; border: 1px solid #e2e8f0; transition: all 0.3s ease; }
        .card-shadow:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }

        .btn-primary { background: var(--primary); color: white; transition: 0.2s; }
        .btn-primary:hover { transform: scale(1.02); filter: brightness(1.1); }
        .animate-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 24px; border-radius: 24px; max-width: 500px; width: 90%; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

    <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 md:px-6 h-20 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="router.navigate('home')">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-200">
                    <i data-lucide="graduation-cap" class="text-white w-6 h-6"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">Gaurav<span class="text-indigo-600">Classes</span></span>
            </div>

            <div class="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-600">
                <button onclick="router.navigate('courses')" class="hover:text-indigo-600 transition">Courses</button>
                <button onclick="router.navigate('books')" class="hover:text-indigo-600 transition">Books</button>
                <button onclick="router.navigate('tests')" class="hover:text-indigo-600 transition">Test Series</button>
                <button onclick="router.navigate('solver')" class="text-indigo-600 font-bold bg-indigo-50 px-4 py-2 rounded-full">AI Solver</button>
                <button id="admin-link" class="hidden bg-rose-50 text-rose-600 px-4 py-2 rounded-full font-bold hover:bg-rose-100 transition">Admin Panel</button>
            </div>

            <div id="nav-actions" class="flex items-center gap-3"></div>
        </div>
    </nav>

    <main id="app-root" class="max-w-7xl mx-auto px-4 md:px-6 py-6 md:py-12 min-h-screen"></main>

    <script type="module">
        // Initialize Supabase
        const SUPABASE_URL = 'https://eskzrffzmjxqoaiptogq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Q5ZhebSkHPWLx8AnvjDOFg_43EmvLs9';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- Global State ---
        let currentUser = null;
        let isAdmin = true;
        let currentFilter = 'all';
        let selectedClass = '10';
        let selectedCourseForCheckout = null;
        let selectedCourseId = null;
        let currentSlide = 0;
        let authMode = 'login'; // 'login' or 'register'

        // Slides data
        const slides = [
            {
                tag: "Admission Open 2026-27",
                title: "Master Your <span class='text-indigo-400'>Future</span> with Gaurav Classes",
                desc: "Join 10,000+ students achieving excellence in CBSE, ICSE, JEE & NEET with India's most trusted educator.",
                btn1: "Browse Courses",
                btn1Action: "courses",
                btn2: "Try AI Solver",
                btn2Action: "solver",
                theme: "from-indigo-900 to-slate-900"
            },
            {
                tag: "Competitive Excellence",
                title: "Crack <span class='text-emerald-400'>JEE & NEET</span> with Gaurav Sir",
                desc: "Get access to premium test series, handwritten notes, and personalized mentorship to secure your rank.",
                btn1: "View Test Series",
                btn1Action: "tests",
                btn2: "Join Batch",
                btn2Action: "courses",
                theme: "from-slate-900 to-emerald-900"
            },
            {
                tag: "Instant Help",
                title: "Stuck on a <span class='text-amber-400'>Doubt?</span> Ask our AI.",
                desc: "Upload a photo of any complex Physics, Chemistry, or Math problem and get a step-by-step solution in seconds.",
                btn1: "Open AI Solver",
                btn1Action: "solver",
                btn2: "Watch Demo",
                btn2Action: "home",
                theme: "from-slate-900 to-indigo-800"
            }
        ];

        // Helper functions
        const isUserLoggedIn = () => currentUser !== null;

        // --- Auth Functions ---
        async function signIn(email, password) {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            return data;
        }

        async function signUp(email, password, name, role = 'student') {
            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) throw error;
            // Create profile
            const { error: profileError } = await supabase.from('profiles').insert([{ 
                id: data.user.id, 
                name, 
                role, 
                class: '10',
                target_exam: 'Board',
                progress: 0
            }]);
            if (profileError) throw profileError;
            return data;
        }

        async function signOut() {
            await supabase.auth.signOut();
            currentUser = null;
            isAdmin = false;
            router.navigate('home');
        }

        // --- Data Fetching (using Supabase) ---
        async function fetchCourses() {
            const { data, error } = await supabase.from('courses').select('*');
            if (error) throw error;
            return data || [];
        }

        async function fetchMaterials(classFilter = null) {
            let query = supabase.from('materials').select('*');
            if (classFilter) query = query.eq('class', classFilter);
            const { data, error } = await query;
            if (error) throw error;
            return data || [];
        }

        async function fetchTestSeries(classFilter = null) {
            let query = supabase.from('test_series').select('*');
            if (classFilter) query = query.eq('class', classFilter);
            const { data, error } = await query;
            if (error) throw error;
            return data || [];
        }

        async function fetchUserEnrollments(userId) {
            const { data, error } = await supabase.from('enrollments').select('*, courses(*)').eq('user_id', userId);
            if (error) throw error;
            return data || [];
        }

        async function fetchUserProfile(userId) {
            const { data, error } = await supabase.from('profiles').select('*').eq('id', userId).single();
            if (error) throw error;
            return data;
        }

        // --- Admin Functions ---
        async function uploadMaterial(file, title, type, classValue, courseId = null) {
            // Upload file to storage
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
            const filePath = `materials/${classValue}/${fileName}`;
            const { data: uploadData, error: uploadError } = await supabase.storage
                .from('lms-materials')
                .upload(filePath, file);
            if (uploadError) throw uploadError;

            // Get public URL
            const { data: { publicUrl } } = supabase.storage.from('lms-materials').getPublicUrl(filePath);

            // Save to materials table
            const { error: insertError } = await supabase.from('materials').insert({
                title,
                type,
                class: classValue,
                file_url: publicUrl,
                course_id: courseId || null
            });
            if (insertError) throw insertError;
            return true;
        }

        async function addCourse(courseData) {
            const { error } = await supabase.from('courses').insert([courseData]);
            if (error) throw error;
            return true;
        }

        // --- UI Components ---
        const ClassPillToggle = (targetView) => `
            <div class="class-pill-grid">
                ${['6','7','8','9','10','11','12','JEE','NEET'].map(c => `
                    <button onclick="setClass('${c}', '${targetView}')" class="class-pill ${selectedClass === c ? 'active' : ''}">
                        ${isNaN(c) ? c : 'Class ' + c}
                    </button>
                `).join('')}
            </div>
        `;

        // --- View Functions ---
        const HomeView = async () => {
            const offers = [
                { icon: 'monitor-play', title: 'Live Interactive Classes', desc: 'Real-time engagement with Gaurav Sir for conceptual clarity.', color: 'indigo' },
                { icon: 'book-marked', title: 'Premium Study Material', desc: 'Class-specific E-Books, PYQs, and handwritten notes.', color: 'emerald' },
                { icon: 'zap', title: 'AI-Powered Doubt Solving', desc: 'Instant step-by-step solutions for any complex problem.', color: 'amber' },
                { icon: 'target', title: 'Specialized Test Series', desc: 'Weekly Mocks & DPPs designed for Boards, JEE, & NEET.', color: 'rose' }
            ];
            const slide = slides[currentSlide];
            return `
                <div class="space-y-20 animate-fade">
                    <div id="hero-slider" class="relative w-full h-[350px] md:h-[500px] bg-slate-900 rounded-[3rem] overflow-hidden shadow-2xl transition-all duration-700 bg-gradient-to-br ${slide.theme}">
                        <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
                        <div class="relative z-10 px-8 md:px-20 h-full flex flex-col justify-center max-w-3xl space-y-6">
                            <div class="animate-fade">
                                <span class="inline-block px-4 py-1.5 bg-white/10 border border-white/20 text-white rounded-full text-[10px] font-bold tracking-widest uppercase mb-4">
                                    ${slide.tag}
                                </span>
                                <h1 class="text-4xl md:text-6xl font-extrabold text-white leading-tight font-heading">
                                    ${slide.title}
                                </h1>
                                <p class="text-slate-300 text-sm md:text-lg max-w-md mt-4">
                                    ${slide.desc}
                                </p>
                                <div class="flex gap-4 mt-8">
                                    <button onclick="router.navigate('${slide.btn1Action}')" class="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-4 rounded-2xl font-bold transition flex items-center gap-2">
                                        ${slide.btn1} <i data-lucide="arrow-right" class="w-5 h-5"></i>
                                    </button>
                                    <button onclick="router.navigate('${slide.btn2Action}')" class="bg-white/10 hover:bg-white/20 backdrop-blur-md text-white border border-white/20 px-8 py-4 rounded-2xl font-bold transition">
                                        ${slide.btn2}
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex gap-3 z-20">
                            ${slides.map((_, i) => `
                                <button onclick="setSlide(${i})" class="w-3 h-3 rounded-full transition-all duration-300 ${currentSlide === i ? 'bg-white w-8' : 'bg-white/30 hover:bg-white/50'}"></button>
                            `).join('')}
                        </div>
                    </div>
                    <div class="space-y-12">
                        <div class="text-center space-y-4">
                            <h2 class="text-4xl font-bold font-heading">What <span class="text-indigo-600">Gaurav Classes</span> Offers</h2>
                            <p class="text-slate-500 max-w-2xl mx-auto italic">"Quality education is not just about marks; it's about building a foundation for life."</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                            ${offers.map(offer => `
                                <div class="card-shadow p-8 rounded-[2.5rem] group hover:bg-white transition-all">
                                    <div class="w-14 h-14 bg-${offer.color}-50 text-${offer.color}-600 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                                        <i data-lucide="${offer.icon}" class="w-7 h-7"></i>
                                    </div>
                                    <h3 class="text-xl font-bold mb-3 text-slate-800">${offer.title}</h3>
                                    <p class="text-slate-500 text-sm leading-relaxed">${offer.desc}</p>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="bg-slate-50 rounded-[3rem] p-12 flex flex-wrap justify-center gap-12 md:gap-24 border border-slate-100">
                        <div class="text-center"><p class="text-4xl font-black text-indigo-600">95%</p><p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-2">Board Result</p></div>
                        <div class="text-center"><p class="text-4xl font-black text-indigo-600">500+</p><p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-2">JEE/NEET Selections</p></div>
                        <div class="text-center"><p class="text-4xl font-black text-indigo-600">24/7</p><p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-2">Doubt Support</p></div>
                    </div>
                </div>`;
        };

        const CoursesView = async () => {
            const courses = await fetchCourses();
            const filtered = currentFilter === 'all' ? courses : courses.filter(c => c.category === currentFilter);
            if (filtered.length === 0) {
                return `<div class="text-center py-20">No courses found. Add some via admin panel.</div>`;
            }
            return `
                <div class="space-y-10 animate-fade">
                    <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                        <h2 class="text-3xl font-bold">Explore <span class="text-indigo-600">Courses</span></h2>
                        <div class="toggle-container">
                            ${['all', 'school', 'engineering', 'medical'].map(f => `
                                <div onclick="setFilter('${f}')" class="toggle-item ${currentFilter === f ? 'active' : ''}">${f.toUpperCase()}</div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        ${filtered.map(c => `
                            <div class="card-shadow p-8 rounded-[2rem] flex flex-col h-full">
                                <div class="flex gap-2 mb-4">
                                    ${c.tags?.map(t => `<span class="text-[10px] font-bold uppercase tracking-widest text-slate-400 bg-slate-100 px-2 py-1 rounded">${t}</span>`).join('')}
                                </div>
                                <h3 class="text-xl font-bold mb-2">${c.title}</h3>
                                <p class="text-sm text-slate-500 mb-4">${c.description?.substring(0,80)}...</p>
                                <div class="mt-auto space-y-4">
                                    <div class="flex justify-between items-center">
                                        <span class="text-2xl font-black text-indigo-600">₹${c.price}</span>
                                        <span class="text-xs text-slate-400">${c.duration}</span>
                                    </div>
                                    <div class="flex gap-3">
                                        <button onclick="router.navigate('course-details', ${c.id})" class="flex-1 bg-slate-100 text-slate-800 py-2.5 rounded-xl font-bold hover:bg-slate-200 transition text-sm">View Details</button>
                                        <button onclick="router.navigate('checkout', ${JSON.stringify(c).replace(/"/g, '&quot;')})" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-xl font-bold hover:bg-indigo-500 transition shadow-sm text-sm">Enroll</button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
        };

        const BooksView = async () => {
            const materials = await fetchMaterials(selectedClass);
            return `
                <div class="space-y-10 animate-fade">
                    <div class="space-y-6">
                        <div class="flex justify-between items-end flex-wrap gap-4">
                            <h2 class="text-3xl font-bold font-heading">Nexus <span class="text-indigo-600">Library</span></h2>
                            <span class="text-[10px] font-bold text-slate-400 bg-slate-100 px-3 py-1 rounded-full">Selected: ${selectedClass}</span>
                        </div>
                        ${ClassPillToggle('books')}
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
                        ${materials.map(m => `
                            <div class="group cursor-pointer" onclick="downloadFile('${m.file_url}', '${m.title}')">
                                <div class="aspect-[3/4] bg-white rounded-[2rem] mb-4 flex flex-col items-center justify-center border-2 border-slate-100 group-hover:border-indigo-600 transition-all shadow-sm overflow-hidden relative">
                                    <div class="absolute top-4 right-4 w-8 h-8 bg-slate-50 rounded-full flex items-center justify-center text-slate-400 group-hover:bg-indigo-600 group-hover:text-white transition">
                                        <i data-lucide="download" class="w-4 h-4"></i>
                                    </div>
                                    <i data-lucide="${m.type === 'video' ? 'video' : (m.type === 'ppt' ? 'presentation' : 'book-open')}" class="text-slate-200 w-16 h-16 mb-4 group-hover:text-indigo-100 transition"></i>
                                    <div class="text-center px-4">
                                        <p class="text-[10px] font-black uppercase text-indigo-500 tracking-tighter mb-1">${m.type?.toUpperCase()}</p>
                                        <h4 class="font-bold text-slate-800 leading-tight text-sm">${m.title}</h4>
                                    </div>
                                    <div class="absolute bottom-0 left-0 w-full h-1 bg-slate-100 group-hover:bg-indigo-600 transition"></div>
                                </div>
                            </div>
                        `).join('')}
                        ${materials.length === 0 ? '<div class="col-span-full text-center text-slate-500">No materials available for this class yet.</div>' : ''}
                    </div>
                    ${isAdmin ? `
                        <div class="mt-8 text-center">
                            <button onclick="showUploadModal()" class="bg-indigo-600 text-white px-6 py-3 rounded-2xl text-sm font-bold">+ Upload Material</button>
                        </div>
                    ` : ''}
                </div>`;
        };

        const TestsView = async () => {
            const testSeries = await fetchTestSeries(selectedClass);
            const categories = [
                { title: 'Weekly Mock Test', key: 'weekly', icon: 'calendar-days', color: 'indigo' },
                { title: 'Chapter Test', key: 'chapter', icon: 'layers', color: 'sky' },
                { title: 'Model Papers', key: 'model', icon: 'file-check', color: 'emerald' },
                { title: 'DPP', key: 'dpp', icon: 'clipboard-list', color: 'amber' },
                { title: 'PYQs', key: 'pyq', icon: 'history', color: 'rose' }
            ];
            // Group test series by category (assuming category field exists)
            const grouped = testSeries.reduce((acc, t) => {
                if (!acc[t.category]) acc[t.category] = [];
                acc[t.category].push(t);
                return acc;
            }, {});
            return `
                <div class="space-y-10 animate-fade">
                    <div class="space-y-6">
                        <div class="flex justify-between items-end">
                            <h2 class="text-3xl font-bold font-heading">Test <span class="text-indigo-600">Series</span></h2>
                            <span class="text-[10px] font-bold text-slate-400 bg-slate-100 px-3 py-1 rounded-full">Grade: ${selectedClass}</span>
                        </div>
                        ${ClassPillToggle('tests')}
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${categories.map(cat => {
                            const tests = grouped[cat.key] || [];
                            return `
                                <div class="card-shadow p-6 rounded-[2rem]">
                                    <div class="flex items-start justify-between mb-6">
                                        <div class="w-12 h-12 bg-${cat.color}-50 rounded-2xl flex items-center justify-center text-${cat.color}-600">
                                            <i data-lucide="${cat.icon}" class="w-6 h-6"></i>
                                        </div>
                                        ${tests.length ? `<span class="text-[10px] font-bold text-white bg-indigo-600 px-2 py-1 rounded-full">${tests.length} tests</span>` : ''}
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-slate-800 text-lg">${cat.title}</h3>
                                        ${tests.length ? `<p class="text-sm text-slate-500 font-medium">${tests[0].description || 'Practice tests available'}</p>` : '<p class="text-sm text-slate-400">Coming soon...</p>'}
                                    </div>
                                    <div class="mt-8">
                                        <button ${!tests.length ? 'disabled' : ''} class="bg-slate-900 text-white px-5 py-2 rounded-xl text-xs font-bold hover:bg-indigo-600 transition ${!tests.length ? 'opacity-50 cursor-not-allowed' : ''}">${tests.length ? 'Start Test' : 'Coming Soon'}</button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>`;
        };

        const DashboardView = async () => {
            if (!currentUser) return '<div class="text-center py-20">Please login first.</div>';
            const profile = await fetchUserProfile(currentUser.id);
            const enrollments = await fetchUserEnrollments(currentUser.id);
            
            return `
                <div class="space-y-10 animate-fade pb-20">
                    <div class="relative bg-gradient-to-r from-indigo-600 to-indigo-800 rounded-[3rem] p-8 md:p-12 text-white overflow-hidden shadow-2xl">
                        <div class="relative z-10 flex flex-col md:flex-row justify-between items-center gap-8">
                            <div class="space-y-4 text-center md:text-left">
                                <span class="inline-block bg-white/20 backdrop-blur-sm px-4 py-1.5 rounded-full text-xs font-bold tracking-widest uppercase border border-white/20">
                                    Student Dashboard
                                </span>
                                <h2 class="text-4xl md:text-5xl font-extrabold font-heading leading-tight">
                                    Welcome back, <br/><span class="text-indigo-200">${profile.name || 'Student'}!</span>
                                </h2>
                                <p class="text-indigo-100 max-w-md">You're enrolled in ${enrollments.length} course(s). Keep learning!</p>
                            </div>
                            <div class="relative w-32 h-32 flex items-center justify-center bg-white/10 rounded-full border-4 border-white/20">
                                <div class="text-center">
                                    <p class="text-2xl font-black">${profile.progress || 0}%</p>
                                    <p class="text-[8px] font-bold">Overall Goal</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">

                }
            } else {
                navActions.innerHTML = `<button onclick="router.navigate('auth')" class="btn-primary px-6 py-2.5 rounded-xl text-sm font-bold">Login</button>`;
                if (adminLink) adminLink.classList.add('hidden');
            }
            lucide.createIcons();
        };

        // --- Auth State Listener ---
        supabase.auth.onAuthStateChange(async (event, session) => {
            currentUser = session?.user || null;
            if (currentUser) {
                const { data: profile } = await supabase.from('profiles').select('role').eq('id', currentUser.id).single();
                isAdmin = profile?.role === 'admin';
            } else {
                isAdmin = false;
            }
            updateNavbar();
            if (window.location.hash === '#admin' && !isAdmin) router.navigate('home');
        });

        // --- Auto-rotate slider ---
        setInterval(() => {
            if (document.getElementById('hero-slider')) {
                currentSlide = (currentSlide + 1) % slides.length;
                router.navigate('home');
            }
        }, 8000);

        // Start the app
        router.navigate('home');
    </script>
</body>
</html>
