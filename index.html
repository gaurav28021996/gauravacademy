<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav Classes | Digital Learning Ecosystem</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #2563eb; --accent: #7c3aed; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; background-color: #f8fafc; color: #1e293b; }
        .glass-header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4); }
        .study-card { transition: all 0.4s ease; }
        .study-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.08); }
        .active-tab { background: linear-gradient(135deg, #2563eb, #7c3aed) !important; color: white !important; }
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyApT8enq5xt47R9DHoNpZJQ61-oFAn7TCk",
            authDomain: "gaurav-classes.firebaseapp.com",
            projectId: "gaurav-classes",
            storageBucket: "gaurav-classes.firebasestorage.app",
            messagingSenderId: "144373758597",
            appId: "1:144373758597:web:bea3cc425ebaa4b477c7ec"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // Expose to global window for HTML onclick events
        window.db = db;

        // Sync Library Real-time
        onSnapshot(collection(db, "library"), (snapshot) => {
            window.libraryData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            if (typeof renderLibrary === "function") renderLibrary();
            console.log("Firebase Synced:", window.libraryData.length, "items");
        });

        // Initialization
        window.addEventListener('load', () => {
            if (typeof initData === "function") initData();
            if (typeof renderHomePlans === "function") renderHomePlans();
            if (typeof checkAuth === "function") checkAuth();
        });
    </script>
</head>
<body>

<header class="sticky top-0 z-[100] glass-header px-4 md:px-8 py-3">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="flex items-center space-x-3 cursor-pointer group" onclick="showView('home')">
            <div class="w-11 h-11 btn-primary rounded-2xl flex items-center justify-center text-white shadow-lg group-hover:rotate-6 transition-transform">
                <i class="fas fa-graduation-cap text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-extrabold tracking-tight">Gaurav Classes</h1>
                <span class="text-[10px] font-bold text-blue-600 uppercase tracking-tighter">Campus 2.0</span>
            </div>
        </div>

        <nav class="hidden lg:flex items-center space-x-1">
            <button onclick="showView('home')" class="px-4 py-2 rounded-xl text-sm font-semibold hover:bg-slate-100">Home</button>
            <button onclick="openLibrary('book')" class="px-4 py-2 rounded-xl text-sm font-semibold hover:bg-slate-100">Library</button>
            <button onclick="openLibrary('pyq')" class="px-4 py-2 rounded-xl text-sm font-semibold hover:bg-slate-100">PYQs</button>
        </nav>

        <div class="flex items-center space-x-3">
            <div id="auth-buttons">
                <button onclick="showView('auth')" class="btn-primary text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg">Login</button>
            </div>
            <div id="user-profile" class="hidden flex items-center space-x-3">
                <div class="flex items-center space-x-3 cursor-pointer" onclick="showView('dashboard')">
                    <span id="user-display-name" class="text-sm font-bold text-slate-700 hidden md:block">Hi, Student</span>
                    <img id="user-avatar" src="" class="w-10 h-10 rounded-xl border-2 border-blue-100">
                </div>
                <button onclick="handleLogout()" class="p-2.5 text-slate-400 hover:text-red-500 transition"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-8">
    <section id="view-home" class="fade-in">
        <div class="py-20 text-center lg:text-left grid lg:grid-cols-2 gap-12 items-center">
            <div>
                <h2 class="text-6xl font-extrabold text-slate-900 leading-tight mb-6">Master Your <br><span class="text-blue-600">Future</span>.</h2>
                <p class="text-slate-500 text-lg mb-10">Integrated learning for Boards, JEE, and NEET.</p>
                <div id="home-plans-grid" class="grid md:grid-cols-2 gap-4"></div>
            </div>
            <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=800" class="rounded-[3rem] shadow-2xl hidden lg:block">
        </div>
    </section>

    <section id="view-library" class="fade-in hidden">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-black">Digital Library</h2>
            <div class="flex bg-slate-100 p-1 rounded-xl" id="library-tabs">
                <button onclick="openLibrary('book')" id="tab-book" class="px-4 py-2 rounded-lg text-sm font-bold">Books</button>
                <button onclick="openLibrary('lecture')" id="tab-lecture" class="px-4 py-2 rounded-lg text-sm font-bold">Lectures</button>
            </div>
        </div>
        <div id="universal-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
    </section>

    <section id="view-auth" class="fade-in hidden py-10">
        <div class="max-w-md mx-auto bg-white p-8 rounded-[2rem] shadow-xl border">
            <h3 class="text-2xl font-black mb-6">Student Login</h3>
            <form onsubmit="handleAuth(event)" class="space-y-4">
                <input type="text" id="reg-name" placeholder="Full Name" required class="w-full p-4 bg-slate-50 rounded-xl border outline-none">
                <input type="email" id="reg-email" placeholder="Email" required class="w-full p-4 bg-slate-50 rounded-xl border outline-none">
                <button type="submit" class="w-full btn-primary text-white py-4 rounded-xl font-bold">Enter Campus</button>
            </form>
        </div>
    </section>

    <section id="view-dashboard" class="fade-in hidden">
        <h2 class="text-3xl font-black mb-2">Welcome, <span id="dash-user-name" class="text-blue-600">Student</span></h2>
        <p class="text-slate-500 mb-8">Class <span id="dash-user-class">10</span> Student Profile</p>
        <div id="dashboard-material-list" class="grid gap-4"></div>
    </section>
</main>

<script>
    const classes = ['6', '7', '8', '9', '10', '11', '12', 'jee', 'neet'];
    window.libraryData = [];
    let currentUser = null;
    let currentViewType = 'book';
    let currentSelectedClass = '10';

    // UI Controller
    function showView(viewId) {
        document.querySelectorAll('main section').forEach(s => s.classList.add('hidden'));
        document.getElementById('view-' + viewId).classList.remove('hidden');
        window.scrollTo(0,0);
    }

    function openLibrary(type) {
        currentViewType = type;
        showView('library');
        renderLibrary();
    }

    // Rendering Logic
    function renderLibrary() {
        const grid = document.getElementById('universal-grid');
        const filtered = window.libraryData.filter(i => i.type === currentViewType);
        
        grid.innerHTML = filtered.map(item => `
            <div class="study-card bg-white p-5 rounded-[2rem] border border-slate-100 shadow-sm">
                <img src="${item.img || 'https://via.placeholder.com/400'}" class="w-full aspect-video object-cover rounded-2xl mb-4">
                <h4 class="font-bold text-slate-800">${item.name}</h4>
                <div class="flex justify-between items-center mt-4">
                    <span class="text-blue-600 font-black">${item.price == 0 ? 'FREE' : '₹'+item.price}</span>
                    <button class="bg-slate-900 text-white px-4 py-2 rounded-lg text-xs font-bold">Open</button>
                </div>
            </div>
        `).join('');
    }

    function renderHomePlans() {
        const grid = document.getElementById('home-plans-grid');
        const plans = [
            { id: '10', title: 'Class 10 Board' },
            { id: '12', title: 'Class 12 Board' },
            { id: 'jee', title: 'JEE / NEET' }
        ];
        grid.innerHTML = plans.map(p => `
            <div onclick="showView('library')" class="p-6 bg-white border rounded-2xl cursor-pointer hover:border-blue-500 transition">
                <h4 class="font-bold">${p.title}</h4>
                <p class="text-xs text-slate-400">View Materials →</p>
            </div>
        `).join('');
    }

    // Auth Engine
    function checkAuth() {
        const saved = localStorage.getItem('gaurav_classes_user');
        if (saved) {
            currentUser = JSON.parse(saved);
            updateUI();
        }
    }

    function handleAuth(e) {
        e.preventDefault();
        currentUser = {
            name: document.getElementById('reg-name').value,
            email: document.getElementById('reg-email').value,
            class: '10'
        };
        localStorage.setItem('gaurav_classes_user', JSON.stringify(currentUser));
        updateUI();
        showView('dashboard');
    }

    function updateUI() {
        if (!currentUser) return;
        document.getElementById('auth-buttons').classList.add('hidden');
        document.getElementById('user-profile').classList.remove('hidden');
        document.getElementById('user-display-name').innerText = "Hi, " + currentUser.name.split(' ')[0];
        document.getElementById('dash-user-name').innerText = currentUser.name;
        document.getElementById('user-avatar').src = `https://ui-avatars.com/api/?name=${currentUser.name}&background=2563eb&color=fff`;
    }

    function handleLogout() {
        if (confirm("Logout?")) {
            localStorage.removeItem('gaurav_classes_user');
            location.reload();
        }
    }
</script>
</body>
</html>
