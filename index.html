<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav Classes | Premium Learning Store</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --bg-primary: #050810;
            --bg-secondary: #0f172a;
            --accent-cyan: #22d3ee;
            --accent-indigo: #6366f1;
            --glass: rgba(15, 23, 42, 0.7);
            --border: rgba(255, 255, 255, 0.08);
        }

        body { font-family: 'Syne', sans-serif; background: var(--bg-primary); color: #f8fafc; }
        h1, h2, h3, .font-heading { font-family: 'Orbitron', sans-serif; }

        .mesh-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                        radial-gradient(at 100% 100%, rgba(34, 211, 238, 0.1) 0px, transparent 50%);
        }

        .glass-card {
            background: var(--glass); backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover { border-color: var(--accent-cyan); transform: translateY(-5px); }

        .shimmer-btn {
            background: linear-gradient(90deg, #6366f1, #22d3ee, #6366f1);
            background-size: 200%;
            animation: shimmer 3s infinite;
            transition: 0.3s;
        }
        @keyframes shimmer { 0% { background-position: 0%; } 100% { background-position: 200%; } }

        .course-badge { @apply text-[10px] font-black uppercase tracking-widest px-3 py-1 rounded-full; }
    </style>
</head>
<body>
    <div class="mesh-bg"></div>

    <header class="sticky top-0 z-[100] px-8 py-4 glass-card mx-4 mt-4 rounded-3xl flex justify-between items-center">
        <div class="flex items-center gap-3 cursor-pointer" onclick="router.navigate('home')">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i data-lucide="graduation-cap" class="text-white w-6 h-6"></i>
            </div>
            <span class="font-heading font-black tracking-tighter text-xl">GAURAV <span class="text-cyan-400 text-sm">CLASSES</span></span>
        </div>

        <nav id="main-nav" class="hidden md:flex gap-10 items-center text-[11px] font-bold uppercase tracking-[0.2em] text-slate-400">
            </nav>

        <div id="user-zone" class="flex gap-4 items-center">
            </div>
    </header>

    <main id="app-root" class="max-w-7xl mx-auto px-6 py-12">
        </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, onSnapshot, query, orderBy, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ── CONFIGURATION (Update with your Firebase Keys) ──
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "gaurav-classes.firebaseapp.com",
            projectId: "gaurav-classes",
            storageBucket: "gaurav-classes.firebasestorage.app",
            messagingSenderId: "...",
            appId: "..."
        };

        const ADMIN_UID = "YOUR_ADMIN_UID"; // Hardcode your UID here

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let userData = null;
        let courses = [];

        // ── VIEWS ──

        const HomeView = () => `
            <section class="space-y-24 py-12">
                <div class="text-center space-y-8">
                    <h1 class="text-6xl md:text-8xl font-black tracking-tighter leading-[0.85] uppercase">
                        Future-Proof <br> <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">Education.</span>
                    </h1>
                    <p class="text-slate-400 max-w-2xl mx-auto text-lg">Premium coaching for Academic Excellence, JEE, NEET, and Polytechnic entrance exams. Start your journey with Gaurav Sir today.</p>
                    <div class="flex justify-center gap-6">
                        <button onclick="router.navigate('store')" class="shimmer-btn px-12 py-5 rounded-2xl font-black uppercase tracking-widest text-sm shadow-2xl">Browse Courses</button>
                        <button class="glass-card px-12 py-5 rounded-2xl font-black uppercase tracking-widest text-sm">Free Resources</button>
                    </div>
                </div>

                <div class="grid md:grid-cols-3 gap-6 h-[400px]">
                    <div class="glass-card p-10 rounded-[2.5rem] flex flex-col justify-end bg-gradient-to-br from-indigo-500/10 to-transparent">
                        <h3 class="text-2xl font-bold">SCHOOLING</h3>
                        <p class="text-slate-500 text-sm">Classes 6th to 12th (All Boards)</p>
                    </div>
                    <div class="glass-card p-10 rounded-[2.5rem] flex flex-col justify-end border-cyan-500/20">
                        <h3 class="text-2xl font-bold">ENGINEERING</h3>
                        <p class="text-slate-500 text-sm">JEE Main/Advanced & Polytechnic</p>
                    </div>
                    <div class="glass-card p-10 rounded-[2.5rem] flex flex-col justify-end bg-gradient-to-tr from-rose-500/10 to-transparent">
                        <h3 class="text-2xl font-bold">MEDICAL</h3>
                        <p class="text-slate-500 text-sm">NEET-UG Foundation & Pro</p>
                    </div>
                </div>
            </section>
        `;

        const StoreView = () => `
            <div class="space-y-12">
                <div class="flex justify-between items-end">
                    <div>
                        <h2 class="text-4xl font-black uppercase tracking-tighter">COURSE <span class="text-cyan-400">CATALOG</span></h2>
                        <p class="text-slate-500 font-medium">Select your path to academic dominance.</p>
                    </div>
                    <div class="flex glass-card p-1 rounded-2xl">
                        <button class="px-6 py-2 bg-indigo-600 rounded-xl text-[10px] font-black uppercase">All</button>
                        <button class="px-6 py-2 text-slate-500 text-[10px] font-black uppercase">JEE/NEET</button>
                        <button class="px-6 py-2 text-slate-500 text-[10px] font-black uppercase">School</button>
                    </div>
                </div>

                <div id="course-grid" class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    ${courses.map(course => `
                        <div class="glass-card p-6 rounded-[2.5rem] flex flex-col group">
                            <div class="w-full aspect-video rounded-[1.5rem] mb-6 overflow-hidden bg-slate-800">
                                <img src="${course.thumbnail || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800'}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">
                            </div>
                            <div class="flex justify-between items-start mb-4">
                                <span class="course-badge bg-cyan-500/10 text-cyan-400">${course.category}</span>
                                <div class="text-right">
                                    <span class="text-xs text-slate-500 line-through">₹${course.originalPrice}</span>
                                    <p class="text-xl font-black text-white">₹${course.price}</p>
                                </div>
                            </div>
                            <h3 class="text-xl font-bold mb-4 leading-tight">${course.title}</h3>
                            <ul class="text-[11px] text-slate-500 space-y-2 mb-8 flex-grow">
                                <li class="flex items-center gap-2"><i data-lucide="check" class="w-3 h-3 text-cyan-400"></i> Full Syllabus Coverage</li>
                                <li class="flex items-center gap-2"><i data-lucide="check" class="w-3 h-3 text-cyan-400"></i> Weekly Mock Tests</li>
                                <li class="flex items-center gap-2"><i data-lucide="check" class="w-3 h-3 text-cyan-400"></i> Live Doubt Sessions</li>
                            </ul>
                            <button onclick="enroll('${course.id}')" class="w-full py-4 rounded-xl bg-white/5 border border-white/10 hover:bg-indigo-600 transition font-black uppercase text-[10px] tracking-[0.2em]">Enroll Now</button>
                        </div>
                    `).join('')}
                </div>
            </div>
        `;

        const AdminView = () => `
            <div class="max-w-4xl mx-auto glass-card p-12 rounded-[3rem] space-y-10 border-indigo-500/20">
                <div class="flex justify-between items-center border-b border-white/5 pb-6">
                    <h2 class="text-2xl font-black uppercase tracking-tighter text-indigo-400">Product Manager</h2>
                    <span class="text-[10px] font-mono opacity-50">GAURAV_SIR_ROOT</span>
                </div>

                <div class="grid md:grid-cols-2 gap-10">
                    <div class="space-y-4">
                        <label class="text-[10px] font-black uppercase tracking-widest text-slate-500">Course Details</label>
                        <input id="p-title" type="text" placeholder="Course Title (e.g. Physics JEE Crash Course)" class="w-full p-4 rounded-xl bg-white/5 border border-white/10 outline-none focus:border-cyan-400 transition">
                        
                        <div class="grid grid-cols-2 gap-4">
                            <select id="p-cat" class="bg-slate-900 border border-white/10 p-4 rounded-xl outline-none">
                                <option>Class 6-8</option><option>Class 9-10</option>
                                <option>Class 11-12</option><option>JEE Main</option>
                                <option>NEET</option><option>Polytechnic</option>
                            </select>
                            <input id="p-price" type="number" placeholder="Offer Price" class="w-full p-4 rounded-xl bg-white/5 border border-white/10 outline-none">
                        </div>
                        
                        <input id="p-orig" type="number" placeholder="Original Price (for discount display)" class="w-full p-4 rounded-xl bg-white/5 border border-white/10 outline-none">
                        <input id="p-img" type="text" placeholder="Thumbnail URL" class="w-full p-4 rounded-xl bg-white/5 border border-white/10 outline-none">
                        
                        <button onclick="addProduct()" class="w-full py-5 bg-indigo-600 rounded-2xl font-black uppercase text-xs tracking-widest shadow-xl shadow-indigo-500/20">Publish Course</button>
                    </div>

                    <div class="bg-black/40 rounded-[2rem] p-6 font-mono text-[10px] flex flex-col border border-white/5 h-[350px]">
                        <p class="text-indigo-400 mb-4 uppercase font-bold tracking-widest">Inventory_Feed</p>
                        <div id="admin-list" class="space-y-4 overflow-y-auto">
                            </div>
                    </div>
                </div>
            </div>
        `;

        // ── LOGIC ──

        window.router = {
            navigate: (view) => {
                const root = document.getElementById('app-root');
                const nav = document.getElementById('main-nav');
                const userZone = document.getElementById('user-zone');

                // Update Nav
                nav.innerHTML = `
                    <button onclick="router.navigate('home')" class="hover:text-cyan-400">Home</button>
                    <button onclick="router.navigate('store')" class="hover:text-cyan-400">Courses</button>
                    ${currentUser ? `<button onclick="router.navigate('dashboard')" class="hover:text-cyan-400">My Learning</button>` : ''}
                    ${currentUser?.uid === ADMIN_UID ? `<button onclick="router.navigate('admin')" class="text-cyan-400">Admin</button>` : ''}
                `;

                // Update User Zone
                userZone.innerHTML = currentUser 
                    ? `<button onclick="handleLogout()" class="text-[10px] font-black uppercase opacity-50 hover:opacity-100">Logout</button>`
                    : `<button onclick="router.navigate('auth')" class="px-6 py-2 bg-white/10 rounded-full text-[10px] font-black uppercase tracking-widest">Login</button>`;

                // Inject View
                if (view === 'home') root.innerHTML = HomeView();
                if (view === 'store') root.innerHTML = StoreView();
                if (view === 'admin') root.innerHTML = AdminView();
                
                lucide.createIcons();
            }
        };

        window.addProduct = async () => {
            const title = document.getElementById('p-title').value;
            const cat = document.getElementById('p-cat').value;
            const price = document.getElementById('p-price').value;
            const original = document.getElementById('p-orig').value;
            const img = document.getElementById('p-img').value;

            await addDoc(collection(db, "courses"), {
                title, category: cat, price, originalPrice: original, thumbnail: img,
                createdAt: serverTimestamp()
            });
            alert("Course Live!");
            location.reload();
        };

        window.enroll = async (courseId) => {
            if (!currentUser) return alert("Please Login to Enroll");
            alert(`Initiating secure payment for ${courseId}. (Integration Placeholder)`);
        };

        window.handleLogout = () => signOut(auth).then(() => location.reload());

        // Global Listeners
        onAuthStateChanged(auth, user => {
            currentUser = user;
            router.navigate('home');
        });

        onSnapshot(query(collection(db, "courses"), orderBy("createdAt", "desc")), (snap) => {
            courses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            if (document.getElementById('course-grid')) router.navigate('store');
        });

        router.navigate('home');

    </script>
</body>
</html>
