        const MediaStore = {
            KEYS: {
                thumbnails: 'gc_thumbnails',
                banners: 'gc_banners',
                pdfs: 'gc_pdfs',
                videos: 'gc_videos',
                courseMedia: 'gc_course_media'
            },

            getAll(type) {
                try {
                    return JSON.parse(localStorage.getItem(this.KEYS[type]) || '[]');
                } catch { return []; }
            },

            save(type, items) {
                try {
                    localStorage.setItem(this.KEYS[type], JSON.stringify(items));
                    return true;
                } catch(e) {
                    if (e.name === 'QuotaExceededError') {
                        showToast('Storage full! Please delete some files first.', 'error');
                    }
                    return false;
                }
            },

            add(type, item) {
                const items = this.getAll(type);
                items.unshift(item);
                return this.save(type, items);
            },

            delete(type, id) {
                const items = this.getAll(type).filter(i => i.id !== id);
                this.save(type, items);
            },

            getById(type, id) {
                return this.getAll(type).find(i => i.id === id);
            },

            getStorageUsage() {
                let total = 0;
                for (const key in localStorage) {
                    if (localStorage.hasOwnProperty(key)) {
                        total += (localStorage[key].length * 2) / 1024 / 1024; // MB
                    }
                }
                return total.toFixed(2);
            },

            getMaxStorage() {
                return 50; // MB estimate for localStorage
            },

            // Attach media to a course
            getCourseMedia(courseId) {
                try {
                    const all = JSON.parse(localStorage.getItem(this.KEYS.courseMedia) || '{}');
                    return all[courseId] || { thumbnail: null, banner: null, videos: [], pdfs: [] };
                } catch { return { thumbnail: null, banner: null, videos: [], pdfs: [] }; }
            },

            setCourseMedia(courseId, data) {
                try {
                    const all = JSON.parse(localStorage.getItem(this.KEYS.courseMedia) || '{}');
                    all[courseId] = data;
                    localStorage.setItem(this.KEYS.courseMedia, JSON.stringify(all));
                } catch(e) {
                    if (e.name === 'QuotaExceededError') showToast('Storage full!', 'error');
                }
            }
        };

                    const base64 = await fileToBase64(file);

                        name: file.name,

                        size: formatBytes(file.size),

                        data: base64,

                        title: file.name.replace(/\.[^/.]+$/, '') // default title = filename without extension
                    };
                    const saved = MediaStore.add(storeKey, item);
                    if (saved) successCount++;
                } catch(err) {
                    showToast(`Failed to process ${file.name}`, 'error');
                }
            }

                            <div class="bg-white border border-slate-100 rounded-2xl p-6 shadow-sm"><div class="flex items-center gap-2 mb-4"><i data-lucide="medal" class="text-indigo-600 w-5 h-5"></i><h3 class="text-lg font-bold">Achievements</h3></div><div class="space-y-4">${achievements.map(ach => `<div><div class="flex justify-between items-center mb-1"><div class="flex items-center gap-2"><i data-lucide="${ach.icon}" class="w-4 h-4 text-${ach.color}-500"></i><span class="text-sm font-bold">${ach.title}</span></div><span class="text-xs text-slate-500">${ach.progress}%</span></div><div class="w-full bg-slate-100 rounded-full h-1.5"><div class="bg-${ach.color}-500 h-1.5 rounded-full" style="width: ${ach.progress}%"></div></div><p class="text-[10px] text-slate-400 mt-1">${ach.description}</p></div>`).join('')}</div><button class="mt-4 w-full text-center text-sm text-indigo-600 font-bold hover:underline">View All Badges</button></div>
                            <div class="grid grid-cols-3 gap-3"><button onclick="router.navigate('solver')" class="bg-indigo-50 hover:bg-indigo-100 p-4 rounded-2xl text-center transition"><i data-lucide="zap" class="w-6 h-6 text-indigo-600 mx-auto mb-2"></i><p class="text-[10px] font-bold text-indigo-600">AI Solver</p></button><button onclick="router.navigate('books')" class="bg-emerald-50 hover:bg-emerald-100 p-4 rounded-2xl text-center transition"><i data-lucide="book" class="w-6 h-6 text-emerald-600 mx-auto mb-2"></i><p class="text-[10px] font-bold text-emerald-600">Library</p></button><button onclick="router.navigate('tests')" class="bg-amber-50 hover:bg-amber-100 p-4 rounded-2xl text-center transition"><i data-lucide="clipboard-check" class="w-6 h-6 text-amber-600 mx-auto mb-2"></i><p class="text-[10px] font-bold text-amber-600">Test Series</p></button></div>
                        </div>
                    </div>
                </div>`;
        };

        // =============================================
        // TESTS VIEW
        // =============================================
        const TestsView = () => {
            const data = testDataByClass[selectedClass] || testDataByClass['10'];
            const categories = [
                { title: 'Weekly Mock Test', key: 'weekly', icon: 'calendar-days', color: 'indigo' },
                { title: 'Chapter Test', key: 'chapter', icon: 'layers', color: 'sky' },
                { title: 'Model Papers', key: 'model', icon: 'file-check', color: 'emerald' },
                { title: 'DPP', key: 'dpp', icon: 'clipboard-list', color: 'amber' },
                { title: 'PYQs', key: 'pyq', icon: 'history', color: 'rose' }
            ];
            return `
                <div class="space-y-10 animate-fade">
                    <div class="space-y-6"><div class="flex justify-between items-end"><h2 class="text-3xl font-bold font-heading">Test <span class="text-indigo-600">Series</span></h2><span class="text-[10px] font-bold text-slate-400 bg-slate-100 px-3 py-1 rounded-full">Grade: ${selectedClass}</span></div>${ClassPillToggle('tests')}</div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${categories.map(cat => `<div class="card-shadow p-6 rounded-[2rem]"><div class="flex items-start justify-between mb-6"><div class="w-12 h-12 bg-${cat.color}-50 rounded-2xl flex items-center justify-center text-${cat.color}-600"><i data-lucide="${cat.icon}" class="w-6 h-6"></i></div></div><div><h3 class="font-bold text-slate-800 text-lg">${cat.title}</h3><p class="text-sm text-slate-500 font-medium">${data[cat.key]}</p></div><div class="mt-8"><button class="bg-slate-900 text-white px-5 py-2 rounded-xl text-xs font-bold hover:bg-indigo-600">Start Test</button></div></div>`).join('')}</div>
                </div>`;
        };

        // =============================================
        // AI SOLVER VIEW
        // =============================================
        const SolverView = () => {
            return `
                <div class="max-w-4xl mx-auto py-20 px-6 animate-fade">
                    <div class="text-center mb-12">
                        <h2 class="text-4xl font-extrabold text-slate-900">Mentor AI</h2>
                        <p class="mt-4 text-slate-500 text-lg">Upload your Math or Science doubt for a step-by-step solution.</p>
                    </div>
                    <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-100">
                        <div id="drop-zone" class="border-2 border-dashed border-slate-200 rounded-2xl p-10 text-center hover:border-indigo-400 transition-colors cursor-pointer">
                            <input type="file" id="file-input" accept="image/*" class="hidden">
                            <div id="preview-container" class="hidden mb-4"><img id="image-preview" class="mx-auto max-h-64 rounded-lg shadow-md"></div>
                            <div id="upload-prompt"><p class="text-slate-600 font-medium">Click to upload or drag & drop a photo</p><p class="text-slate-400 text-sm mt-1">PNG, JPG up to 10MB</p></div>
                        </div>
                        <button id="solve-btn" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed">Get Step-by-Step Solution</button>
                        <div id="solution-output" class="hidden mt-10 p-6 bg-slate-50 rounded-2xl border border-slate-200">
                            <h3 class="font-bold text-slate-800 mb-4 flex items-center"><span class="w-2 h-6 bg-indigo-500 rounded-full mr-3"></span>Mentor AI's Solution</h3>
                            <div id="solution-text" class="prose prose-slate max-w-none text-slate-700 leading-relaxed"></div>
                        </div>
                    </div>
                </div>
            `;
        };

        // =============================================
        // MOCK DATA
        // =============================================
        const mockUserData = {
            name: "Gaurav",
            enrolledClass: "10",
            targetExam: "JEE 2028",
            progress: 68,
            recentActivity: [
                { type: 'video', title: 'Quadratic Equations - Part 2', date: '2 hours ago' },
                { type: 'test', title: 'Weekly Mock Test #4', date: 'Yesterday' }
            ],
            enrolledCourses: [
                { id: 5, title: "Class 10 Board Pro", instructor: "Gaurav Sir", status: "Active" }
            ]
        };

        // =============================================
        // MENTOR AI INIT
        // =============================================
        const toBase64ForAI = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });

        const initMentorAI = () => {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            const solveBtn = document.getElementById('solve-btn');
            const outputArea = document.getElementById('solution-output');
            const outputText = document.getElementById('solution-text');
            const preview = document.getElementById('image-preview');
            const previewCont = document.getElementById('preview-container');
            const uploadPrompt = document.getElementById('upload-prompt');

            if (!dropZone) return;

            dropZone.onclick = () => fileInput.click();
            fileInput.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        preview.src = event.target.result;
                        previewCont.classList.remove('hidden');
                        uploadPrompt.classList.add('hidden');
                    };
                    reader.readAsDataURL(file);
                }
            };

            solveBtn.onclick = async () => {
                if (!fileInput.files[0]) { alert("Please upload an image first!"); return; }
                const GEMINI_API_KEY = "AIzaSyAbNpAPUGV5NiMRqBGfxxVBwBNApKQ4eCw";
                solveBtn.disabled = true;
                solveBtn.innerHTML = '<span class="flex items-center justify-center gap-2"><i data-lucide="loader-2" class="animate-spin w-5 h-5"></i> Thinking...</span>';
                lucide.createIcons();
                try {
                    const base64Data = await toBase64ForAI(fileInput.files[0]);
                    const mimeType = fileInput.files[0].type;
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                        method: "POST", headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents: [{ parts: [{ text: "You are an expert Math and Science tutor. Identify the educational problem in this image. Provide a detailed, step-by-step solution with clear explanations suitable for a Class 10-12 student. Use markdown formatting (headings, bullet points, math expressions) for clarity." }, { inline_data: { mime_type: mimeType, data: base64Data } }] }] })
                    });
                    if (!response.ok) { const errorData = await response.json(); throw new Error(errorData.error?.message || "API request failed"); }
                    const data = await response.json();
                    const resultText = data.candidates[0].content.parts[0].text;
                    outputArea.classList.remove('hidden');
                    if (typeof marked !== 'undefined') { outputText.innerHTML = marked.parse(resultText); } else { outputText.innerText = resultText; }
                    outputArea.scrollIntoView({ behavior: 'smooth' });
                } catch (error) {
                    console.error("API Error:", error);
                    alert("Mentor AI is currently busy: " + error.message);
                } finally {
                    solveBtn.disabled = false;
                    solveBtn.innerHTML = "Get Step-by-Step Solution";
                    lucide.createIcons();
                }
            };
        };

        // =============================================
        // ROUTER
        // =============================================
        window.router = {
            navigate: (view, data = null) => {
                if ((view === 'dashboard' || view === 'checkout' || view === 'player') && !isUserLoggedIn()) { 
                    authMode = 'login'; view = 'auth'; 
                }
                if (data) {
                    if (view === 'checkout') selectedCourseForCheckout = data;
                    if (view === 'course-details') selectedCourseId = data;
                    if (view === 'player') selectedCourseId = data;
                }
                const root = document.getElementById('app-root');
                const views = {
                    home: HomeView,
                    courses: CoursesView,
                    books: BooksView,
                    tests: TestsView,
                    solver: SolverView,
                    dashboard: DashboardView,
                    auth: AuthView,
                    checkout: CheckoutView,
                    'course-details': CourseDetailsView,
                    'player': CoursePlayerView,
                    admin: AdminView
                };
                const viewFn = views[view];
                if (viewFn) { root.innerHTML = viewFn(); } else { root.innerHTML = HomeView(); }
                updateNavbar();
                lucide.createIcons();
                if (view === 'solver') initMentorAI();
                window.scrollTo(0,0);
            }
        };

        // =============================================
        // EVENT HANDLERS
        // =============================================
        window.setFilter = (f) => { currentFilter = f; router.navigate('courses'); };
        window.setClass = (c, view) => { selectedClass = c; router.navigate(view); };
        window.setSlide = (index) => { currentSlide = index; router.navigate('home'); };
        window.setAdminTab = (tab) => { adminTab = tab; router.navigate('admin'); };
        window.handleAuthSubmit = () => { 
            localStorage.setItem('isLoggedIn', 'true'); 
            router.navigate(selectedCourseForCheckout ? 'checkout' : 'dashboard'); 
        };
        window.handleLogout = () => { 
            localStorage.removeItem('isLoggedIn'); 
            selectedCourseForCheckout = null; 
            router.navigate('home'); 
        };
        window.toggleAuthMode = () => { 
            authMode = authMode === 'login' ? 'register' : 'login'; 
            router.navigate('auth'); 
        };
        window.completePurchase = () => {
            alert('Payment Gateway Demo: Course Enrolled!');
            localStorage.setItem('isLoggedIn', 'true');
            router.navigate('dashboard');
        };

        const updateNavbar = () => {
            const navActions = document.getElementById('nav-actions');
            if (!navActions) return;
            if (isUserLoggedIn()) {
                navActions.innerHTML = `<div class="flex items-center gap-4"><button onclick="router.navigate('dashboard')" class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600"><i data-lucide="layout-dashboard" class="w-5 h-5"></i></button><button onclick="handleLogout()" class="px-5 py-2.5 bg-rose-50 text-rose-600 rounded-xl text-sm font-bold flex items-center gap-2"><i data-lucide="log-out" class="w-4 h-4"></i> Logout</button></div>`;
            } else {
                navActions.innerHTML = `<button onclick="router.navigate('auth')" class="btn-primary px-6 py-2.5 rounded-xl text-sm font-bold">Login</button>`;
            }
            lucide.createIcons();
        };

        // Auto-rotate slider
        setInterval(() => {
            if (document.getElementById('hero-slider')) {
                currentSlide = (currentSlide + 1) % slides.length;
                router.navigate('home');
            }
        }, 10000);

        // Start
        router.navigate('home');
    </script>
</body>
</html>
