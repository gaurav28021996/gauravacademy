<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav Classes | Premium Learning Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --primary: #2563eb; --accent: #7c3aed; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; scroll-behavior: smooth; }
        
        .glass-header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.3); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4); }

        .study-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(0,0,0,0.05); }
        .study-card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-tab { background: linear-gradient(135deg, #2563eb, #7c3aed) !important; color: white !important; transform: scale(1.05); box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.3); }
        
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header class="sticky top-0 z-[100] glass-header px-4 md:px-8 py-3">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="flex items-center space-x-3 cursor-pointer group" onclick="showView('home')">
            <div class="w-11 h-11 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-lg group-hover:rotate-6 transition-transform">
                <i class="fas fa-graduation-cap text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-extrabold tracking-tight leading-none">Gaurav Classes</h1>
                <span class="text-[10px] font-bold text-blue-600 uppercase tracking-tighter">Digital Campus</span>
            </div>
        </div>

        <nav class="hidden lg:flex items-center space-x-2">
            <button onclick="showView('home')" class="px-4 py-2 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-100 transition">Home</button>
            <button onclick="openLibrary('book')" class="px-4 py-2 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-100 transition">Books</button>
            <button onclick="openLibrary('pyq')" class="px-4 py-2 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-100 transition">PYQs</button>
            <button onclick="openLibrary('test')" class="px-4 py-2 rounded-xl text-sm font-bold text-slate-600 hover:bg-slate-100 transition">Tests</button>
        </nav>

        <div class="flex items-center space-x-4">
            <button onclick="showView('checkout')" class="relative p-2.5 rounded-xl hover:bg-slate-100 transition">
                <i class="fa-solid fa-cart-shopping text-slate-700"></i>
                <span id="cart-count" class="absolute top-1 right-1 bg-blue-600 text-white text-[9px] font-black w-4 h-4 rounded-full flex items-center justify-center border-2 border-white">0</span>
            </button>
            <button class="btn-primary text-white px-6 py-2.5 rounded-xl font-bold text-sm">Login</button>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-6 py-8">
    <section id="view-home" class="fade-in">
        <div class="grid lg:grid-cols-2 gap-12 items-center py-10">
            <div>
                <div class="inline-flex items-center space-x-2 bg-blue-50 border border-blue-100 px-3 py-1 rounded-full mb-6">
                    <span class="flex h-2 w-2 rounded-full bg-blue-600 animate-pulse"></span>
                    <span class="text-xs font-bold text-blue-700 uppercase">Enrollment Open 2026</span>
                </div>
                <h2 class="text-5xl md:text-7xl font-extrabold text-slate-900 leading-[1.1] mb-6">
                    Master Your <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">Curriculum.</span>
                </h2>
                <div class="grid grid-cols-2 gap-4 mb-8">
                    <button onclick="openLibrary('book')" class="p-6 bg-white rounded-3xl border border-slate-100 shadow-sm hover:border-blue-500 transition text-left group">
                        <i class="fas fa-book text-blue-600 mb-3 text-2xl group-hover:scale-110 transition"></i>
                        <p class="font-bold text-slate-800">NCERT Books</p>
                    </button>
                    <button onclick="openLibrary('test')" class="p-6 bg-white rounded-3xl border border-slate-100 shadow-sm hover:border-purple-500 transition text-left group">
                        <i class="fas fa-vial text-purple-600 mb-3 text-2xl group-hover:scale-110 transition"></i>
                        <p class="font-bold text-slate-800">Chapter Tests</p>
                    </button>
                </div>
            </div>
            <div class="hidden lg:block">
                <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80&w=800" class="rounded-[3rem] shadow-2xl">
            </div>
        </div>
    </section>

    <section id="view-library" class="fade-in hidden">
        <div class="mb-10">
            <h2 id="lib-title" class="text-4xl font-extrabold text-slate-900 mb-2">Library</h2>
            <p id="lib-desc" class="text-slate-500 font-medium italic"></p>
        </div>

        <div class="flex overflow-x-auto space-x-3 pb-6 no-scrollbar mb-8" id="class-tabs">
            <button onclick="filterByClass('12')" class="class-tab px-8 py-3.5 rounded-2xl bg-white border border-slate-200 font-bold text-sm whitespace-nowrap" data-class="12">Class 12</button>
            <button onclick="filterByClass('11')" class="class-tab px-8 py-3.5 rounded-2xl bg-white border border-slate-200 font-bold text-sm whitespace-nowrap" data-class="11">Class 11</button>
            <button onclick="filterByClass('10')" class="class-tab px-8 py-3.5 rounded-2xl bg-white border border-slate-200 font-bold text-sm whitespace-nowrap" data-class="10">Class 10</button>
            <button onclick="filterByClass('jee')" class="class-tab px-8 py-3.5 rounded-2xl bg-blue-50 text-blue-600 border border-blue-100 font-black text-sm whitespace-nowrap" data-class="jee">JEE</button>
            <button onclick="filterByClass('neet')" class="class-tab px-8 py-3.5 rounded-2xl bg-emerald-50 text-emerald-600 border border-emerald-100 font-black text-sm whitespace-nowrap" data-class="neet">NEET</button>
        </div>

        <div id="universal-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            </div>
    </section>
</main>

<script>
    // 1. DATA CENTER
    const libraryData = [
        { id: 1, type: 'book', class: '12', name: 'Physics NCERT Part 1', price: 0, tag: 'NCERT', img: 'https://via.placeholder.com/300x400?text=Physics+12' },
        { id: 2, type: 'book', class: '12', name: 'Chemistry NCERT', price: 0, tag: 'NCERT', img: 'https://via.placeholder.com/300x400?text=Chemistry+12' },
        { id: 3, type: 'pyq', class: '12', name: 'CBSE Board 2025 Paper', price: 0, tag: 'Solved', img: 'https://via.placeholder.com/300x400?text=PYQ+2025' },
        { id: 4, type: 'test', class: '12', name: 'Electrostatics Test', price: 0, tag: 'Practice', img: 'https://via.placeholder.com/300x400?text=Test+1' },
        { id: 5, type: 'book', class: 'jee', name: 'HC Verma Physics', price: 450, tag: 'Reference', img: 'https://via.placeholder.com/300x400?text=HC+Verma' },
        { id: 6, type: 'pyq', class: '10', name: 'Maths Standard 2024', price: 0, tag: 'Official', img: 'https://via.placeholder.com/300x400?text=Math+10' }
    ];

    let currentView = 'book';
    let currentClass = '12';

    // 2. NAVIGATION LOGIC
    function showView(viewId) {
        document.querySelectorAll('main section').forEach(s => s.classList.add('hidden'));
        document.getElementById('view-' + viewId).classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openLibrary(type) {
        currentView = type;
        const titles = {
            'book': { t: 'Digital Library', d: 'Premium NCERT and Reference textbooks.' },
            'pyq': { t: 'Previous Year Papers', d: 'Last 10 years solved papers for board prep.' },
            'test': { t: 'Chapter Tests', d: 'Interactive quizzes to test your knowledge.' }
        };
        document.getElementById('lib-title').innerText = titles[type].t;
        document.getElementById('lib-desc').innerText = titles[type].d;
        
        showView('library');
        renderGrid();
    }

    // 3. RENDER ENGINE (The Loop)
    function renderGrid() {
        const grid = document.getElementById('universal-grid');
        grid.innerHTML = '';

        const filtered = libraryData.filter(item => item.type === currentView && item.class === currentClass);

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="col-span-full py-20 text-center text-slate-400 font-bold">No items found for this selection.</div>`;
            return;
        }

        filtered.forEach(item => {
            const isTest = item.type === 'test';
            grid.innerHTML += `
                <div class="study-card bg-white p-5 rounded-[2.5rem] fade-in">
                    <div class="relative overflow-hidden rounded-[1.5rem] mb-4 group">
                        <img src="${item.img}" class="w-full h-52 object-cover transition-transform group-hover:scale-105">
                        <div class="absolute top-3 left-3 bg-white/90 backdrop-blur px-3 py-1 rounded-lg text-[10px] font-black uppercase text-blue-600">${item.tag}</div>
                    </div>
                    <h4 class="font-bold text-slate-800 truncate px-1">${item.name}</h4>
                    <div class="flex justify-between items-center mt-5 pt-4 border-t border-slate-50">
                        <span class="font-black text-blue-600">${item.price === 0 ? 'FREE' : '₹' + item.price}</span>
                        <button onclick="handleAction(${item.id})" class="flex items-center space-x-2 bg-slate-900 text-white px-5 py-2.5 rounded-2xl hover:bg-blue-600 transition">
                            <i class="fas ${isTest ? 'fa-play' : (item.price === 0 ? 'fa-download' : 'fa-cart-plus')} text-xs"></i>
                            <span class="text-xs font-bold">${isTest ? 'Start' : (item.price === 0 ? 'Get' : 'Buy')}</span>
                        </button>
                    </div>
                </div>`;
        });
    }

    function filterByClass(classId) {
        currentClass = classId;
        document.querySelectorAll('.class-tab').forEach(t => t.classList.remove('active-tab'));
        const btn = document.querySelector(`[data-class="${classId}"]`);
        if(btn) btn.classList.add('active-tab');
        renderGrid();
    }

    function handleAction(id) {
        const item = libraryData.find(i => i.id === id);
        if(item.type === 'test') {
            alert("Starting Test: " + item.name);
        } else {
            alert(item.name + " added to bag!");
            updateCart(1);
        }
    }

    let cartCount = 0;
    function updateCart(val) {
        cartCount += val;
        document.getElementById('cart-count').innerText = cartCount;
    }

    // Initialize
    window.onload = () => filterByClass('12');
</script>

</body>
</html>
