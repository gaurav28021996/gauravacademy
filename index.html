<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaurav Classes | Modern Learning</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --primary: #4f46e5;
            --primary-light: #eef2ff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --border: #e2e8f0;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main);
            scroll-behavior: smooth;
        }

        h1, h2, h3, .font-heading { font-family: 'Outfit', sans-serif; }

        .nav-blur {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .card-shadow {
            background: var(--card-bg);
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
        }

        .card-shadow:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: #4338ca;
            transform: scale(1.02);
        }

        .ai-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>

    <nav class="sticky top-0 z-50 nav-blur">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="flex items-center gap-2 cursor-pointer" onclick="router.navigate('home')">
                <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-200">
                    <i data-lucide="graduation-cap" class="text-white w-6 h-6"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">Gaurav<span class="text-indigo-600">Classes</span></span>
            </div>

            <div class="hidden md:flex items-center gap-8 text-sm font-semibold text-slate-600">
                <button onclick="router.navigate('courses')" class="hover:text-indigo-600 transition">Courses</button>
                <button onclick="router.navigate('books')" class="hover:text-indigo-600 transition">Books</button>
                <button onclick="router.navigate('tests')" class="hover:text-indigo-600 transition">Test Series</button>
                <button onclick="router.navigate('solver')" class="flex items-center gap-2 text-indigo-600 bg-indigo-50 px-4 py-2 rounded-full hover:bg-indigo-100 transition">
                    <i data-lucide="sparkles" class="w-4 h-4"></i> AI Solver
                </button>
            </div>

            <div id="auth-zone">
                <button onclick="router.navigate('auth')" class="btn-primary px-6 py-2.5 rounded-full text-sm font-bold shadow-md">Get Started</button>
            </div>
        </div>
    </nav>

    <main id="app-root" class="max-w-7xl mx-auto px-6 py-12 min-h-[calc(100vh-80px)]">
        </main>

    <script type="module">
        // --- Router Logic ---
        window.router = {
            navigate: (view) => {
                const root = document.getElementById('app-root');
                window.scrollTo(0,0);
                
                if(view === 'home') root.innerHTML = HomeView();
                if(view === 'courses') root.innerHTML = CoursesView();
                if(view === 'books') root.innerHTML = BooksView();
                if(view === 'tests') root.innerHTML = TestsView();
                if(view === 'solver') root.innerHTML = SolverView();
                if(view === 'auth') root.innerHTML = AuthView();
                
                lucide.createIcons();
            }
        };

        // --- Views ---

        const HomeView = () => `
            <div class="flex flex-col md:flex-row items-center gap-12 py-12">
                <div class="flex-1 space-y-8">
                    <span class="bg-indigo-100 text-indigo-700 px-4 py-1 rounded-full text-sm font-bold uppercase tracking-wide">New: 2026 Batch Open</span>
                    <h1 class="text-5xl md:text-7xl font-extrabold text-slate-900 leading-[1.1]">The Smart Way to <span class="text-indigo-600">Excel</span> in Exams.</h1>
                    <p class="text-lg text-slate-600 leading-relaxed max-w-lg">High-quality coaching for CBSE, UP Board, JEE, and NEET. Personalized study plans and AI-driven doubt clearance.</p>
                    <div class="flex gap-4">
                        <button onclick="router.navigate('courses')" class="btn-primary px-8 py-4 rounded-2xl font-bold text-lg shadow-xl shadow-indigo-200">Explore Courses</button>
                        <button onclick="router.navigate('tests')" class="bg-white border-2 border-slate-200 px-8 py-4 rounded-2xl font-bold text-lg hover:border-indigo-600 hover:text-indigo-600 transition">Try Test Series</button>
                    </div>
                </div>
                <div class="flex-1 w-full h-[400px] bg-slate-200 rounded-[3rem] overflow-hidden shadow-2xl relative">
                    <div class="absolute inset-0 flex items-center justify-center text-slate-400">
                        <i data-lucide="image" class="w-12 h-12"></i>
                        <span class="ml-2 font-bold uppercase tracking-widest">Banner Image</span>
                    </div>
                </div>
            </div>
        `;

        const TestsView = () => `
            <div class="space-y-12">
                <div class="border-b pb-8">
                    <h2 class="text-3xl font-bold mb-2">Academic <span class="text-indigo-600">Test Series</span></h2>
                    <p class="text-slate-500">Real-time exam simulation for Classes 6-12 & Competitive Exams.</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div class="space-y-6">
                        <h3 class="flex items-center gap-2 font-bold text-slate-800 uppercase text-sm tracking-widest"><i data-lucide="layers" class="w-4 h-4"></i> Chapter Tests</h3>
                        ${renderTestItem("Physics: Motion", "25 Qs", "₹49")}
                        ${renderTestItem("Maths: Sets", "30 Qs", "₹49")}
                    </div>
                    <div class="space-y-6">
                        <h3 class="flex items-center gap-2 font-bold text-slate-800 uppercase text-sm tracking-widest"><i data-lucide="file-text" class="w-4 h-4"></i> Model Papers</h3>
                        ${renderTestItem("Annual Mock 2026", "80 Marks", "₹149")}
                        ${renderTestItem("Mid-term Special", "40 Marks", "₹99")}
                    </div>
                    <div class="space-y-6">
                        <h3 class="flex items-center gap-2 font-bold text-slate-800 uppercase text-sm tracking-widest"><i data-lucide="history" class="w-4 h-4"></i> PYQs</h3>
                        ${renderTestItem("Solved PYQ 2024", "Full Sol.", "₹79")}
                        ${renderTestItem("10 Year Bundle", "Maths/Sci", "₹299")}
                    </div>
                </div>
            </div>
        `;

        const SolverView = () => `
            <div class="max-w-3xl mx-auto space-y-8 py-10">
                <div class="text-center space-y-4">
                    <div class="w-16 h-16 ai-gradient rounded-3xl mx-auto flex items-center justify-center shadow-xl shadow-indigo-200">
                        <i data-lucide="cpu" class="text-white w-8 h-8"></i>
                    </div>
                    <h2 class="text-4xl font-extrabold">Instant <span class="text-indigo-600">AI Solver</span></h2>
                    <p class="text-slate-500">Solve any Math or Science problem instantly.</p>
                </div>

                <div class="bg-white p-8 rounded-[2rem] border-2 border-slate-100 shadow-xl space-y-6">
                    <textarea class="w-full h-48 p-6 rounded-2xl bg-slate-50 border-0 focus:ring-2 focus:ring-indigo-500 text-lg outline-none" placeholder="Type your question here..."></textarea>
                    <div class="flex gap-4">
                        <button class="flex-1 py-4 bg-slate-900 text-white rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-black transition">
                            <i data-lucide="upload" class="w-5 h-5"></i> Upload Image
                        </button>
                        <button class="flex-1 py-4 btn-primary rounded-2xl font-bold flex items-center justify-center gap-2 shadow-lg shadow-indigo-100">
                            Get Solution
                        </button>
                    </div>
                </div>
            </div>
        `;

        const BooksView = () => `
            <div class="space-y-12">
                <div class="flex justify-between items-end">
                    <h2 class="text-3xl font-bold">Digital <span class="text-indigo-600">Library</span></h2>
                    <div class="flex bg-slate-200 p-1 rounded-xl">
                        <button class="px-4 py-2 bg-white rounded-lg text-sm font-bold shadow-sm">NCERT</button>
                        <button class="px-4 py-2 text-sm font-bold text-slate-600">Exclusive</button>
                    </div>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-8">
                    ${renderBook("Maths Class 10", "NCERT Official", "Free")}
                    ${renderBook("Physics Class 12", "NCERT Official", "Free")}
                    ${renderBook("Concept Mastery", "Gaurav Sir", "₹499")}
                    ${renderBook("Shortcut Tricks", "Gaurav Sir", "₹199")}
                    ${renderBook("Biology 11", "NCERT Official", "Free")}
                </div>
            </div>
        `;

        const AuthView = () => `
            <div class="max-w-md mx-auto py-12">
                <div class="bg-white p-10 rounded-[2.5rem] border border-slate-100 shadow-2xl space-y-8">
                    <div class="text-center space-y-2">
                        <h2 class="text-3xl font-extrabold">Welcome <span class="text-indigo-600">Back</span></h2>
                        <p class="text-slate-500 text-sm">Sign in to your student dashboard</p>
                    </div>
                    <div class="space-y-4">
                        <input type="email" placeholder="Email Address" class="w-full">
                        <input type="password" placeholder="Password" class="w-full">
                        <button class="w-full btn-primary py-4 rounded-2xl font-bold shadow-lg shadow-indigo-100">Login to Academy</button>
                        <p class="text-center text-sm font-bold text-slate-500 cursor-pointer">Don't have an account? <span class="text-indigo-600">Register</span></p>
                    </div>
                </div>
            </div>
        `;

        const CoursesView = () => `
            <div class="space-y-12">
                <div class="text-center max-w-2xl mx-auto space-y-4">
                    <h2 class="text-4xl font-extrabold">Learning <span class="text-indigo-600">Programs</span></h2>
                    <p class="text-slate-500">Structured courses designed for success in board exams and beyond.</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    ${renderCourse("Foundation Batch", "Class 6 to 10", "Maths & Science Focus", "indigo")}
                    ${renderCourse("Master PCBM", "Class 11 & 12", "Advanced Curriculum", "orange")}
                    ${renderCourse("Ranker's Batch", "JEE & NEET", "Competitive Edge", "rose")}
                </div>
            </div>
        `;

        // --- Render Helpers ---

        function renderTestItem(title, info, price) {
            return `
                <div class="bg-white p-5 rounded-2xl border border-slate-100 flex justify-between items-center hover:border-indigo-200 transition group cursor-pointer">
                    <div class="space-y-1">
                        <h4 class="font-bold text-slate-800">${title}</h4>
                        <p class="text-xs text-slate-400 font-bold uppercase">${info}</p>
                    </div>
                    <button class="bg-slate-100 text-slate-900 group-hover:bg-indigo-600 group-hover:text-white px-4 py-2 rounded-xl text-sm font-black transition">
                        ${price}
                    </button>
                </div>
            `;
        }

        function renderBook(title, author, price) {
            return `
                <div class="space-y-4 group cursor-pointer">
                    <div class="aspect-[3/4] bg-slate-100 rounded-2xl flex items-center justify-center border-2 border-transparent group-hover:border-indigo-600 transition overflow-hidden">
                        <i data-lucide="book-open" class="text-slate-300 w-12 h-12"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-sm">${title}</h4>
                        <p class="text-xs text-slate-500 mb-2">${author}</p>
                        <span class="text-sm font-black text-indigo-600">${price}</span>
                    </div>
                </div>
            `;
        }

        function renderCourse(title, grade, sub, color) {
            return `
                <div class="card-shadow p-8 rounded-[2.5rem] space-y-6">
                    <div class="w-14 h-14 bg-${color}-100 rounded-2xl flex items-center justify-center">
                        <i data-lucide="layers" class="text-${color}-600 w-7 h-7"></i>
                    </div>
                    <div>
                        <span class="text-xs font-black uppercase text-${color}-600 tracking-widest">${grade}</span>
                        <h3 class="text-2xl font-bold mt-1">${title}</h3>
                        <p class="text-slate-500 mt-2">${sub}</p>
                    </div>
                    <button class="w-full py-4 border-2 border-slate-100 rounded-2xl font-bold hover:bg-indigo-600 hover:text-white hover:border-indigo-600 transition">View Details</button>
                </div>
            `;
        }

        // --- Init ---
        router.navigate('home');
    </script>
</body>
</html>
