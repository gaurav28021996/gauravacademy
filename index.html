    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root { --primary: #4f46e5; --bg: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: #1e293b; overflow-x: hidden; }
        h1, h2, h3, .font-heading { font-family: 'Outfit', sans-serif; }

        .toggle-container { display: inline-flex; background: #f1f5f9; padding: 4px; border-radius: 16px; border: 1px solid #e2e8f0; }
        .toggle-item { padding: 8px 20px; border-radius: 12px; font-size: 0.875rem; font-weight: 600; transition: all 0.2s; cursor: pointer; color: #64748b; }
        .toggle-item.active { background: white; color: var(--primary); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.1); }

        .class-pill-grid { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .class-pill-grid::-webkit-scrollbar { display: none; }
        .class-pill { white-space: nowrap; padding: 6px 16px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; border: 2px solid #f1f5f9; background: white; color: #94a3b8; transition: 0.2s; }
        .class-pill.active { border-color: var(--primary); color: var(--primary); background: #eff6ff; }

        .card-shadow { background: white; border: 1px solid #e2e8f0; transition: all 0.3s ease; }
        .card-shadow:hover { border-color: var(--primary); transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }

        .btn-primary { background: var(--primary); color: white; transition: 0.2s; }
        .btn-primary:hover { transform: scale(1.02); filter: brightness(1.1); }
        .animate-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

            authMode = authMode === 'login' ? 'register' : 'login';
            router.navigate('auth');
        };

        const updateNavbar = () => {
            const navActions = document.getElementById('nav-actions');
            if (!navActions) return;
            if (isUserLoggedIn()) {
                navActions.innerHTML = `
                    <div class="flex items-center gap-4">
                        <button onclick="router.navigate('dashboard')" class="w-10 h-10 rounded-full bg-indigo-50 flex items-center justify-center text-indigo-600 hover:bg-indigo-100 transition"><i data-lucide="layout-dashboard" class="w-5 h-5"></i></button>
                        <button onclick="handleLogout()" class="px-5 py-2.5 bg-rose-50 text-rose-600 rounded-xl text-sm font-bold hover:bg-rose-100 transition flex items-center gap-2"><i data-lucide="log-out" class="w-4 h-4"></i> Logout</button>
                    </div>`;
            } else {
                navActions.innerHTML = `<button onclick="router.navigate('auth')" class="btn-primary px-6 py-2.5 rounded-xl text-sm font-bold">Login</button>`;
            }
            lucide.createIcons();
        };

        // --- Final Initialization ---
        router.navigate('home');
    </script>
</body>
</html>
